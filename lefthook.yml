# Git hooks (L1/L2). Бюджеты: pre-commit < 10 с, pre-push < 60 с.
# Защищённый файл: менять только человеку.
pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{ts,tsx,js,mjs,cjs,json,jsonc,css,md,yml,yaml}'
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    lint:
      glob: '*.{ts,tsx,js,mjs,cjs}'
      run: pnpm exec oxlint --type-aware --deny-warnings {staged_files}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: pnpm turbo run typecheck --output-logs=errors-only
    test:
      run: pnpm turbo run test --output-logs=errors-only
    boundaries:
      run: pnpm boundaries
