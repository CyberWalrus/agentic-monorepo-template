packages:
  - apps/*
  - packages/*
  - e2e

# Supply chain: свежие релизы ставятся не раньше чем через сутки после публикации.
minimumReleaseAge: 1440
# Все версии внешних зависимостей объявляются только здесь (catalog:).
catalogMode: strict
# Install-скрипты зависимостей запрещены, пока явно не разрешены здесь.
allowBuilds:
  # Хуки ставит `pnpm prepare` (lefthook install), postinstall не нужен.
  lefthook: false

# TS 7 пока без JS API (обещан в 7.1). Инструментам на Compiler API подкладываем
# TS 6 только в их собственный резолв; проект компилируется TS 7.
packageExtensions:
  dependency-cruiser:
    dependencies:
      typescript: npm:@typescript/typescript6@^6.0.2
  '@stryker-mutator/core':
    dependencies:
      typescript: npm:@typescript/typescript6@^6.0.2

