  # Сканер секретов (b6, решение 2026-11-15): npm-пакет из каталога, а не бинарь
  # вне цепочки поставок. Мажор движка и пресета десинхронизированы у апстрима.
  '@secretlint/secretlint-rule-preset-recommend': ^13.1.0
  secretlint: ^14.0.1
  '@stryker-mutator/core': ^10.1.1
  '@stryker-mutator/vitest-runner': ^10.1.1
  '@tanstack/react-query': ^5.108.2
