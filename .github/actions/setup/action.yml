name: Setup
description: Node (из .nvmrc), pnpm (из packageManager), зависимости по lockfile.
inputs:
  playwright:
    description: Установить Chromium для Playwright / Vitest browser mode
    default: 'false'
  cache:
    description: Кэш pnpm store в setup-node ('false' — для workflow, чей workspace после установки получает checkout чужого дерева, e24)
    default: 'true'
runs:
  using: composite
  steps:
    # E28_MARKER — разовый маркер канарейки «какую версию локального экшена исполняет
    # $/.github/actions/setup в pull_request_target» (ADR 0002, ADR 0014). Шаг есть
    # только в версии PR: появился в логе gate-integrity — исполнилась версия из PR;
    # не появился — из base. После считывания лога шаг удаляется тем же PR.
    - name: E28 marker (step exists only in the PR version of the action)
      shell: bash
      run: |
        echo "E28_MARKER: PR version of .github/actions/setup/action.yml is executing"
        echo "E28_MARKER: event=${GITHUB_EVENT_NAME} action_path=${GITHUB_ACTION_PATH}"
        echo "E28_MARKER: marker lines in executed action.yml: $(grep -c E28_MARKER "${GITHUB_ACTION_PATH}/action.yml" 2>/dev/null || true)"
        echo "E28_MARKER: marker lines in workspace action.yml: $(grep -c E28_MARKER .github/actions/setup/action.yml 2>/dev/null || true)"
        echo "E28_MARKER: workspace HEAD=$(git -C "${GITHUB_WORKSPACE:-.}" rev-parse HEAD 2>/dev/null || echo n/a)"
    # В контейнерных job (visual) workspace смонтирован с чужим uid: git отказывает
    # с "dubious ownership", и prepare-скрипт pnpm install (lefthook install) падает.
    - name: Trust workspace for git (container jobs)
      shell: bash
      run: git config --global --add safe.directory "${GITHUB_WORKSPACE:-$(pwd)}"
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Cache Playwright browsers
      if: inputs.playwright == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
    - name: Install Chromium
      if: inputs.playwright == 'true'
      shell: bash
      run: pnpm --filter @repo/e2e exec playwright install --with-deps chromium
