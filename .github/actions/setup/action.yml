name: Setup
description: Node (из .nvmrc), pnpm (из packageManager), зависимости по lockfile.
inputs:
  playwright:
    description: Установить Chromium для Playwright / Vitest browser mode
    default: 'false'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Cache Playwright browsers
      if: inputs.playwright == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
    - name: Install Chromium
      if: inputs.playwright == 'true'
      shell: bash
      run: pnpm --filter @repo/e2e exec playwright install --with-deps chromium
