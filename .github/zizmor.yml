# Точечные подавления zizmor (e23). Формат записи — «имя файла:строка»
# (документация zizmor: только basename файла, 1-based), подавлять находки в
# composite-экшенах через этот конфиг нельзя — подавляем только workflow-файлы.
# Запись привязана к номеру строки: правка ВЫШЕ строки сдвигает подавление,
# находка вернётся красным шагом zizmor — это fail-loud повторный триаж,
# а не дыра. Полные основания — в backlog/done/e23.md и PR.
rules:
  dangerous-triggers:
    ignore:
      # gate-integrity.yml:11 — доверенный гейт целостности (ADR 0002):
      # pull_request_target обязателен, определение workflow берётся из базовой
      # ветки, код PR не читается и не исполняется — checkout только base.sha
      # (шаг «Checkout trusted base»), скрипты и список путей — только из базы.
      # Шапка файла прямо запрещает расширение доверия; подавление кодифицирует
      # уже принятый компромисс ADR 0002, не ослабляет его.
      - gate-integrity.yml:11
      # visual-approve.yml:18 — доверенный workflow одобрения визуальных
      # базлайнов (ADR 0015): issue_comment обязателен (команда /approve-visual).
      # Существующие защиты: комментарий перечитывается из API (шаг «Fetch
      # comment and PR facts»), одобрение валидирует tools/check-visual-approval.ts,
      # форк-PR отклоняются, исполняется только дефолтная ветка, дерево PR
      # используется только для git-операций с явным токеном в URL.
      - visual-approve.yml:18
  adhoc-packages:
    ignore:
      # evals.yml:74 — осознанная глобальная установка Claude Code CLI с точным
      # пином версии через env.CLAUDE_CODE_VERSION (ADR 0016): это инструмент
      # прогона, не зависимость workspace — в lockfile ей не место; установка
      # живёт только внутри job (прецедент — copier в canaries).
      - evals.yml:74
