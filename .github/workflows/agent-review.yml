# Агентное ревью PR (b5). Информационное: не входит в `gate`, merge блокируют только
# детерминированные проверки. Требует секрет ANTHROPIC_API_KEY (или CLAUDE_CODE_OAUTH_TOKEN)
# и установленное Claude GitHub App.
#
# Гарантии b5:
# - ревью не исполняет код проекта: whitelist инструментов (чтение + git diff/log/show),
#   запись и сеть запрещены на уровне permissions, а не инструкцией «не делай»;
#   результаты verify/мутаций/покрытия ревью берёт из артефактов CI (actions: read), а не гоняет сам;
# - запуск по ready_for_review и вручную (workflow_dispatch с номером PR), не на каждый push;
# - модель и предел ходов заданы явно (ANTHROPIC_MODEL, --max-turns);
# - каждый blocker обязан строкой «BLOCKER <гейт>: <файл>:<строка> — суть» — шаг
#   аннотаций превращает их в ::error на head-коммите PR.
# Ограничение платформы (честно): hosted-раннер не умеет декларативный egress-фаервол —
# сеть job сужена whitelist'ом инструментов (без WebFetch/WebSearch) и отсутствием
# исполнения кода проекта; полный egress-контроль — при переносе на self-hosted.
name: Agent review

on:
  pull_request:
    types: [ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Номер PR для ревью
        required: true
        type: string

concurrency:
  group: agent-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  review:
    name: agent-review
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      # Явная модель (b5): меняется здесь, в одном месте.
      ANTHROPIC_MODEL: claude-sonnet-4-5
    steps:
      - name: Skip without credentials
        if: env.HAS_KEY != 'true'
        run: echo "::notice::ANTHROPIC_API_KEY is not configured, agent review skipped."

      - uses: actions/checkout@v7
        if: env.HAS_KEY == 'true'
        with: { fetch-depth: 0 }

      - name: Specialist reviewers (repo subagents)
        if: env.HAS_KEY == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          settings: |
            {
              "disableAllHooks": true,
              "permissions": {
                "allow": [
                  "Read",
                  "Grep",
                  "Glob",
                  "LS",
                  "TodoWrite",
                  "Task",
                  "Bash(git diff:*)",
                  "Bash(git log:*)",
                  "Bash(git show:*)"
                ],
                "deny": [
                  "Write",
                  "Edit",
                  "MultiEdit",
                  "NotebookEdit",
                  "WebFetch",
                  "WebSearch",
                  "Bash"
                ]
              }
            }
          claude_args: --max-turns 50
          prompt: |
            Review PR #${{ env.PR_NUMBER }} in ${{ github.repository }}.
            The diff is `git diff origin/${{ github.base_ref || 'main' }}...HEAD`; the PR description holds the task and acceptance criteria.

            Run these subagents from .claude/agents in parallel, giving each the task, the acceptance criteria and the diff:
            architecture-reviewer, sanity-reviewer, test-quality-reviewer, security-reviewer, product-logic-reviewer.

            Constraints (enforced by the tool whitelist above, repeated here for the plan):
            - You can only read the repository and run `git diff` / `git log` / `git show`.
            - Do NOT run project code (no pnpm/npm/node/test commands): deterministic results
              (verify, mutation, coverage, e2e) come from CI artifacts, not from your runs.
            - Do not modify files, do not set labels, do not approve the PR: your output is advisory;
              merge is decided by CI `gate` and human reviewers.

            Post ONE comment, structured exactly like this:
            1) Header line: `agent-review (model: $ANTHROPIC_MODEL, PR: <number>)`.
            2) Table: `reviewer | verdict (approve / changes-requested) | blockers (count)`.
            3) For every blocker and major finding, a line in this exact format:
               `BLOCKER <gate>: <file>:<line> — <what>; fix: <how>`
               where <gate> is one of: static, unit, e2e, visual, perf, mutation, bundle-delta,
               gate-integrity, docs, manual. Major (non-blocking) findings use the same format
               with prefix `MAJOR` instead of `BLOCKER`. Skip minor nitpicks.
            These lines are machine-parsed into PR annotations — keep the format exact.

      - name: Blockers to PR annotations
        if: env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Ввод workflow_dispatch — только цифры (панель ввода мейнтейнера, но граница явная).
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::PR_NUMBER must be numeric"; exit 1; }
          BODY=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq '[.[] | select(.body | startswith("agent-review"))] | last | .body' 2>/dev/null || echo "")
          if [ -z "$BODY" ]; then
            echo "::notice::agent-review comment not found, nothing to annotate."
            exit 0
          fi
          # Аннотации в Actions ограничены 10 error + 10 warning на шаг.
          grep -E '^(BLOCKER|MAJOR) ' <<<"$BODY" | head -20 | while IFS= read -r LINE; do
            case "$LINE" in
              BLOCKER*) echo "::error title=agent-review::${LINE:8}" ;;
              MAJOR*)   echo "::warning title=agent-review::${LINE:6}" ;;
            esac
          done
          if ! grep -q '^BLOCKER ' <<<"$BODY"; then
            echo "::notice::agent-review: blockers not found."
          fi
