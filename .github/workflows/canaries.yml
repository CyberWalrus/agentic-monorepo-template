# Канарейки гейтов (З6, B1): плохие изменения в worktree обязаны ронять свои шаги verify.
# Гоняются при изменении гейтов и их конфигов и в nightly — в каждом PR не нужны
# (docs/roadmap.md B1), поэтому отдельный workflow, не входящий в `gate`.
name: Gate canaries

on:
  pull_request:
    paths:
      - tools/**
      - .claude/**
      - .github/actions/**
      - turbo.json
      - pnpm-workspace.yaml
      - package.json
      - pnpm-lock.yaml
      - .oxlintrc.json
      - .oxfmtrc.json
      - .dependency-cruiser.cjs
      - knip.json
      - lefthook.yml
      - tsconfig.base.json
      - tsconfig.json
      - '**/vitest.config.ts'
      - e2e/playwright.config.ts
      - '**/stryker.config.json'
      - .nvmrc
      # Файлы шаблона (d8.3): bad-change в copier.yml обязан красить канарейку
      # копии на PR, а не только в nightly.
      - copier.yml
      - .copier-answers.yml.jinja
      - .github/rulesets/**
      - tools/copier-version.txt
      - .github/CODEOWNERS.jinja
      - docs/CODEOWNERS
  # Push в main (e79): PR с согласованными breaking changes держит negative control
  # красным по замыслу (шаг openapi), и отдельные канарейки на нём не судятся —
  # они судятся здесь, на main после мержа, где negative control зелёный.
  # Необязательный check: вне needs у gate и required checks.
  #
  # Пути — суперсет PR-фильтра + apps/**, packages/**, e2e/**: канарейки судят
  # verify по всему дереву, и сломать их может мерж, тронувший только код
  # (24.11 — e57, тест с точным списком процедур в packages/contracts). Мержи
  # только с docs/backlog прогон не запускают. Оба списка сверяет
  # tools/test/check-workflow-health.test.ts.
  push:
    branches: [main]
    paths:
      - tools/**
      - .claude/**
      - .github/actions/**
      - turbo.json
      - pnpm-workspace.yaml
      - package.json
      - pnpm-lock.yaml
      - .oxlintrc.json
      - .oxfmtrc.json
      - .dependency-cruiser.cjs
      - knip.json
      - lefthook.yml
      - tsconfig.base.json
      - tsconfig.json
      - '**/vitest.config.ts'
      - e2e/playwright.config.ts
      - '**/stryker.config.json'
      - .nvmrc
      - copier.yml
      - .copier-answers.yml.jinja
      - .github/rulesets/**
      - tools/copier-version.txt
      - .github/CODEOWNERS.jinja
      - docs/CODEOWNERS
      - apps/**
      - packages/**
      - e2e/**
  # Правки самих workflow (.github/workflows/**) канарейки не перезапускают —
  # их защиту обеспечивает gate-integrity (pull_request_target из base, З2).
  workflow_dispatch:

concurrency:
  # PR: группа на номер PR, устаревший прогон отменяется. Push в main (e79):
  # группа на SHA и без отмены — каждый мерж получает свой вердикт (~14 мин).
  # Отменённый прогон чекер здоровья счёл бы красным: для push с paths-фильтром
  # красный conclusion последнего завершённого прогона — нарушение.
  group: canaries-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  canaries:
    name: canaries
    runs-on: ubuntu-latest
    # 45 мин: slow-канарейки с perf (A6 PR-1) на холодном кэше раннера.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Полная история: bundle-delta в негатив-проверках и канарейке строит
        # базу от merge-base(HEAD, origin/main) (A6 PR-2, ADR 0013).
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: $/.github/actions/setup
        # Негатив-контроль гоняет turbo test: web/ui browser-тесты требуют браузеры.
        with: { playwright: 'true' }
      # Установка в корневом чекауте греет pnpm store — install в worktree
      # линкуется из него, а не качает с нуля.
      - run: pnpm install --frozen-lockfile
      # Канарейка копии (d8.3) гоняет copier: PyPI вне allowlist песочницы
      # агента (ADR 0004, З5-исключение) — её гоняют CI и человек. Версия —
      # один источник tools/copier-version.txt (З10).
      - run: pipx install "copier==$(cat tools/copier-version.txt)"
      - run: pnpm canaries

  # Канарейка read-only ACL токена turbo-кэша (e27; ADR 0017, правило 2):
  # токен environment cache-read — тот же, что получают PR-job'ы ci.yml, —
  # обязан читать remote-кэш и не писать в него. Серверную гарантию из
  # репозитория не видно: чекер ходит тем же PUT, каким пишет turbo. Секрета
  # нет — зелёная с предупреждением (проверять нечего); токен пишет — красная.
  turbo-acl:
    name: turbo cache-read token is read-only (e27)
    # На PR вердикту не доверяем: проверку исполнял бы сам код PR, а токен
    # PR-коду лишний раз не выдаётся. Значимы push в main и ручной прогон;
    # ночной (расписание) — job turbo-acl в nightly.yml.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: cache-read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ vars.TURBO_API }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # Только встроенные модули Node: установка зависимостей не нужна.
      - run: node tools/check-turbo-acl.ts
