# Доверенный гейт целостности (З2, ADR 0002): определение workflow берётся из базовой
# ветки, код PR не читается и не исполняется. Список файлов — из GitHub API.
#
# ЗАПРЕЩЕНО менять без режима обслуживания и ревью мейнтейнера. Запрещено:
# - добавлять события триггеров или checkout любого ref, кроме base.sha;
# - исполнять что-либо из PR (скрипты и список путей — только из базы);
# - использовать секреты: у этого события есть доступ к секретам репозитория.
name: gate-integrity

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]
    # edited обязателен: смена base-ветки не порождает synchronize, а зелёный check
    # привязан к head SHA — без edited retarget оставил бы проверенный не тот дифф.
  merge_group:

concurrency:
  group: gate-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

permissions:
  contents: read

jobs:
  # Новый push обнуляет прежнее одобрение: снимаем label до того, как integrity
  # прочитает состояние. «Label не стоит» — успех, а не ошибка.
  unlabel-stale-approval:
    name: unlabel-stale-approval
    # Снимать не только на synchronize: close → push → reopen приносит новый
    # head-коммит без события synchronize, и устаревший label пережил бы reopen
    # (находка security-ревью A6 PR-2). ready_for_review — то же для черновиков.
    if: >-
      github.event_name == 'pull_request_target' &&
      contains(fromJSON('["synchronize", "reopened", "ready_for_review"]'), github.event.action)
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove approvals older than this push
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # DELETE без предварительного GET: чтение label отдаёт кэшированный 404
          # сразу после установки (eventual consistency) — доверять ему нельзя.
          # Оба одобрения (гейт и рост бандла, ADR 0013) действуют только до
          # следующего push: новый head-коммит обнуляет их.
          for LABEL in gate-change-approved bundle-growth-approved; do
            if gh api -X DELETE "repos/${{ github.repository }}/issues/$PR_NUMBER/labels/$LABEL"; then
              echo "Снят label $LABEL: новый push требует нового одобрения."
            else
              echo "Label $LABEL не стоял (DELETE вернул 404) — снимать нечего."
            fi
          done

  integrity:
    name: gate-integrity
    if: always() && github.event_name == 'pull_request_target'
    needs: [unlabel-stale-approval]
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Fail-closed (З4): если job снятия label упал, проверке нельзя доверять
      # состояние label — падаем, а не пропускаем (skipped check зачёлся бы как success).
      - name: Fail if unlabel job failed
        if: needs.unlabel-stale-approval.result == 'failure'
        run: |
          echo "unlabel-stale-approval упал: состояние label недостоверно, проверка блокируется."
          exit 1

      # Только base.sha. Никогда не checkout head PR и merge ref (код PR под токеном
      # этого события — паттерн pwn request). Локальный экшен тоже резолвится из базы.
      - name: Checkout trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: $/.github/actions/setup

      - name: Fetch PR facts from GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json labels,headRefOid > pr.json
          HEAD_SHA=$(jq -r .headRefOid pr.json)
          gh api --paginate "repos/${{ github.repository }}/pulls/$PR_NUMBER/files" > files.json
          gh api "repos/${{ github.repository }}/commits/$HEAD_SHA" > head-commit.json
          # pushedAt gh pr view не отдаёт (Unknown JSON field, поймано на #65):
          # время последнего push — самое раннее started_at check-run'а на
          # head-коммите; ставит его GitHub, автор подделать не может.
          # Нет ни одного check-run — fail-closed (ремонт: перезапуск job).
          # e16: --paginate — чек-ранов на head-коммите может быть больше 100
          # (per_page — размер страницы, не предел); обрезка сдвигала бы
          # min started_at в будущее — fail-open freshness-метки.
          # Две команды, не пайп: bash шага — bash -e без pipefail, сбой gh
          # на второй странице в пайпе дал бы зелёный шаг на усечённых данных.
          # jq -s склеивает страницы в один объект с полем check_runs —
          # форма входа jq-агрегаций и node-чекеров не меняется.
          gh api --paginate "repos/${{ github.repository }}/commits/$HEAD_SHA/check-runs?per_page=100" > check-runs-pages.json
          jq -s '{total_count: length, check_runs: [.[].check_runs[]]}' check-runs-pages.json > pushed-check-runs.json
          PUSHED_AT=$(jq -r '[.check_runs[].started_at] | min // empty' pushed-check-runs.json)
          if [ -z "$PUSHED_AT" ]; then
            echo "check-run'ов на $HEAD_SHA нет — время последнего push не вычислить" >&2
            exit 1
          fi
          jq --arg pushedAt "$PUSHED_AT" '.pushedAt = $pushedAt' pr.json > pr.json.tmp && mv pr.json.tmp pr.json
          # Лента событий отстаёт от свежепоставленного label (eventual consistency):
          # опрашиваем до минуты, иначе сценарий «поставили label — перезапустился run»
          # ловит пустую ленту и честно отказывает в одобрении.
          for _ in 1 2 3 4; do
            gh api --paginate "repos/${{ github.repository }}/issues/$PR_NUMBER/events" > events.json
            if grep -q '"event":"labeled"\|"event": "labeled"' events.json \
              && grep -q 'gate-change-approved' events.json; then
              break
            fi
            echo "События labeled ещё нет в ленте — ждём 15 с."
            sleep 15
          done

      - name: Approval is valid only from a maintainer after the last push
        id: approval
        # Кандидаты CODEOWNERS в порядке приоритета GitHub: шаблон держит живой файл
        # в docs/ (копия получает рендер в .github/, d8.2).
        run: node tools/check-gate-approval.ts pr.json events.json .github/CODEOWNERS CODEOWNERS docs/CODEOWNERS head-commit.json

      - name: Changed files against protected paths
        env:
          APPROVED: ${{ steps.approval.outputs.approved }}
        run: node tools/check-protected-paths.ts --api-files files.json ${{ env.APPROVED == 'true' && '--approved' || '' }}

      # C9.3: попытка обхода гейтов в CI — факт в журнал отказов (артефакт);
      # в записи только дата/гейт/тип, содержимого кода и сообщений нет.
      - name: Denial journal (C9.3)
        if: failure()
        run: |
          mkdir -p reports
          printf '%s\n' "{\"date\":\"$(date -u +%FT%TZ)\",\"gate\":\"gate-integrity\",\"reason\":\"protected-path-change\"}" >> reports/denials.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: gate-denials
          path: reports/denials.jsonl
          if-no-files-found: ignore

  # Дельта-гейт бандла: доверенное одобрение роста (A6 PR-2, ADR 0013).
  # Определение из base (pull_request_target), код PR не исполняется — по
  # образцу ADR 0002: замер делает ci-job bundle-delta (untrusted, merge-ref),
  # решение — здесь, по GitHub API. Fail-closed: check-run не найден, не
  # завершён, отменён или одобрение невалидно — красный.
  bundle-approval:
    name: bundle-approval
    if: always() && github.event_name == 'pull_request_target'
    needs: [unlabel-stale-approval]
    permissions:
      contents: read
      pull-requests: read
      checks: read
    runs-on: ubuntu-latest
    # 30 мин: poll чеков 20 мин + poll событий ~1 мин + финальные чтения; ci-job
    # bundle-delta имеет 25 мин — окно ожидания шире его худшего случая.
    timeout-minutes: 30
    steps:
      # Fail-closed (З4): если job снятия label упал, состоянию label нельзя
      # доверять — падаем, а не пропускаем. Симметрично job'у integrity.
      - name: Fail if unlabel job failed
        if: needs.unlabel-stale-approval.result == 'failure'
        run: |
          echo "unlabel-stale-approval упал: состояние label недостоверно, проверка блокируется."
          exit 1

      # Только base.sha. Никогда не checkout head PR и merge ref (код PR под токеном
      # этого события — паттерн pwn request). Локальный экшен тоже резолвится из базы.
      - name: Checkout trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: $/.github/actions/setup

      - name: Fetch PR facts and check runs from GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json labels,headRefOid > pr.json
          HEAD_SHA=$(jq -r .headRefOid pr.json)
          gh api "repos/${{ github.repository }}/commits/$HEAD_SHA" > head-commit.json
          # pushedAt gh pr view не отдаёт (Unknown JSON field, поймано на #65):
          # время последнего push — самое раннее started_at check-run'а на
          # head-коммите; ставит его GitHub, автор подделать не может.
          # Нет ни одного check-run — fail-closed (ремонт: перезапуск job).
          # e16: --paginate — чек-ранов на head-коммите может быть больше 100
          # (per_page — размер страницы, не предел); обрезка сдвигала бы
          # min started_at в будущее — fail-open freshness-метки.
          # Две команды, не пайп: bash шага — bash -e без pipefail, сбой gh
          # на второй странице в пайпе дал бы зелёный шаг на усечённых данных.
          # jq -s склеивает страницы в один объект с полем check_runs —
          # форма входа jq-агрегаций и node-чекеров не меняется.
          gh api --paginate "repos/${{ github.repository }}/commits/$HEAD_SHA/check-runs?per_page=100" > check-runs-pages.json
          jq -s '{total_count: length, check_runs: [.[].check_runs[]]}' check-runs-pages.json > pushed-check-runs.json
          PUSHED_AT=$(jq -r '[.check_runs[].started_at] | min // empty' pushed-check-runs.json)
          if [ -z "$PUSHED_AT" ]; then
            echo "check-run'ов на $HEAD_SHA нет — время последнего push не вычислить" >&2
            exit 1
          fi
          jq --arg pushedAt "$PUSHED_AT" '.pushedAt = $pushedAt' pr.json > pr.json.tmp && mv pr.json.tmp pr.json
          # Лента событий отстаёт от свежепоставленного label (eventual consistency):
          # опрашиваем до минуты, иначе сценарий «поставили label — перезапустился run»
          # ловит пустую ленту и честно отказывает в одобрении.
          for _ in 1 2 3 4; do
            gh api --paginate "repos/${{ github.repository }}/issues/$PR_NUMBER/events" > events.json
            if grep -q 'bundle-growth-approved' events.json; then
              break
            fi
            echo "События labeled для bundle-growth-approved ещё нет в ленте — ждём 15 с."
            sleep 15
          done
          # bundle-delta (ci.yml, merge-ref) мог ещё не завершиться к началу job'а:
          # ждём до 15 минут. queued/in_progress — ждать; если за окно не завершился
          # или не появился вовсе — fail-closed, ремонт: перезапустить job
          # bundle-approval (ADR 0013, «красный по таймауту ≠ рост»).
          for _ in $(seq 1 80); do
            gh api --paginate "repos/${{ github.repository }}/commits/$HEAD_SHA/check-runs?per_page=100" > check-runs-pages.json
            jq -s '{total_count: length, check_runs: [.[].check_runs[]]}' check-runs-pages.json > check-runs.json
            TOTAL=$(jq '[.check_runs[] | select(.name == "bundle-delta")] | length' check-runs.json)
            PENDING=$(jq '[.check_runs[] | select(.name == "bundle-delta" and .status != "completed")] | length' check-runs.json)
            if [ "$TOTAL" -gt 0 ] && [ "$PENDING" -eq 0 ]; then
              break
            fi
            echo "bundle-delta ещё не завершён (total=$TOTAL, pending=$PENDING) — ждём 15 с."
            sleep 15
          done
          gh api --paginate "repos/${{ github.repository }}/commits/$HEAD_SHA/check-runs?per_page=100" > check-runs-pages.json
          jq -s '{total_count: length, check_runs: [.[].check_runs[]]}' check-runs-pages.json > check-runs.json

      - name: Bundle growth gate
        # Кандидаты CODEOWNERS в порядке приоритета GitHub (как в integrity).
        run: node tools/check-bundle-gate.ts check-runs.json pr.json events.json head-commit.json .github/CODEOWNERS CODEOWNERS docs/CODEOWNERS

  # Job'ы merge_group. В очереди определение workflow — из временной
  # ветки с изменениями PR, повторная проверка не из доверенной базы; PR попадает
  # в очередь только после зелёного gate-integrity и ревью по ruleset (ADR 0002).
  # Имя обязано совпадать с required check, иначе очередь будет ждать вечно.
  merge-ack:
    name: gate-integrity
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Acknowledge merge queue entry
        run: echo "gate-integrity проверен на head SHA до попадания в очередь."

  bundle-ack:
    name: bundle-approval
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Acknowledge merge queue entry
        run: echo "bundle-delta проверен на head SHA до попадания в очередь (ADR 0013)."
