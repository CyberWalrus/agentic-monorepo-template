# L5: эталонные агентные прогоны (evals, ADR 0016). Не блокирует merge, при
# падении заводит issue. Дорого (минуты агента и токены) — поэтому не в каждом
# PR: запуск при изменении обвязки на main и раз в неделю (задача C9.1).
name: Agent evals

on:
  push:
    branches: [main]
    paths:
      - '.claude/**'
      - 'AGENTS.md'
      - 'tools/**'
  schedule:
    # Понедельник 05:00 UTC — после Nightly (03:00), чтобы не пересекаться на раннерах.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  # З10: версия CLI агента — единственный источник здесь. Сторонний инструмент
  # в контуре — по прецеденту copier (ADR 0004, З5-исключение): точный пин,
  # установка в job, обновление — отдельный review-класс PR.
  CLAUDE_CODE_VERSION: '2.1.328'

concurrency:
  group: agent-evals-${{ github.ref }}
  # Прогон платит токенами за полный замер: отменять идущий прогон новым merge
  # нельзя (находка arch-ревью C9.1) — длина ограничена таймаутом job.
  cancel-in-progress: false

jobs:
  # Факт секрета проверяет шаг гейта: env недоступен в job-level if
  # (документация контекстов) — первый прогон в main (13c4ae2) упал с нулём
  # jobs именно на этом; outputs — каноническая проводка.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_key: ${{ steps.check.outputs.has_key }}
    steps:
      - id: check
        env:
          EVALS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$EVALS_API_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          fi

  evals:
    name: agent evals
    needs: [gate]
    if: needs.gate.outputs.has_key == 'true'
    runs-on: ubuntu-latest
    # Бюджет контура (З6): таймаут job. Внутри агент ограничен --timeout-minutes
    # раннера (90 по умолчанию, калибровка 2026-11-19), install и verify —
    # собственными лимитами; запас job — на установку CLI и хвост verify.
    timeout-minutes: 150
    steps:
      # persist-credentials: false — агент с --dangerously-skip-permissions
      # работает в worktree с общим git-dir; токен job в .git/config ему не нужен
      # (находка security-ревью C9.1; прецедент — visual-approve.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: $/.github/actions/setup
        with: { playwright: 'true' }
      # CLI агента: pnpm add — встроенная команда (как pnpm install), гейт
      # tool-class пропускает её намеренно (ADR 0016); глобальная установка
      # живёт только внутри этого job.
      - run: pnpm add -g "@anthropic-ai/claude-code@${{ env.CLAUDE_CODE_VERSION }}"
      - run: mkdir -p reports && pnpm evals --all
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evals-${{ github.run_id }}
          path: reports/evals/
          retention-days: 90
      # Бюджет токенов прогона (e16): дрейф стоимости красит job, алерт — через
      # существующий report-job (issue). Порог — по правилам «Порогов» ADR 0009:
      # факт раннера 2026-11-19 — два сопоставимых прогона полного сценария,
      # 23 181 313 и 20 882 265 токенов (медиана 22 031 789; отчёты в
      # backlog/done/c9.1.md — AC-прогонки FAIL, локальная машина, не CI);
      # запас ×3 (прецедент абсолютных потолков ADR 0006), округление вверх
      # до 10M → cap 70 000 000 на сценарий; предел прогона = cap ×
      # totals.scenarios — добавление сценария в --all не ужимает бюджет молча.
      # tokensMeasured != scenarios — fail-closed: null-токен не ноль (находка
      # arch-ревью C9.1); отсутствие/неединственность отчёта — тоже fail-closed.
      # if: success() (дефолт): на красном прогоне отчёта может не быть (агент
      # умер до записи), факт бюджета осмыслен для завершённого прогона, а issue
      # на красный и так заводит report-job.
      - name: Token budget (e16)
        run: |
          shopt -s nullglob
          REPORTS=(reports/evals/report-*.json)
          if [ "${#REPORTS[@]}" -ne 1 ]; then
            echo "ожидался один отчёт reports/evals/report-*.json, найдено ${#REPORTS[@]} — fail-closed" >&2
            exit 1
          fi
          if MSG=$(jq -er --argjson cap 70000000 '
            if .totals.tokensMeasured != .totals.scenarios then
              error("tokensMeasured=\(.totals.tokensMeasured) != scenarios=\(.totals.scenarios) — метрика токенов неполна, бюджет неутверждаем (fail-closed)")
            elif .totals.tokens > ($cap * .totals.scenarios) then
              error("tokens \(.totals.tokens) > порога \(($cap * .totals.scenarios)) — дрейф стоимости прогона (cap \($cap) × \(.totals.scenarios) сценариев)")
            else
              "OK: tokens \(.totals.tokens) <= порога \(($cap * .totals.scenarios)) (cap \($cap)/сценарий × \(.totals.scenarios) сценариев)"
            end
          ' "${REPORTS[0]}" 2>&1); then
            echo "evals tokens: $MSG" >> "$GITHUB_STEP_SUMMARY"
            echo "$MSG"
          else
            echo "evals tokens: $MSG" >> "$GITHUB_STEP_SUMMARY"
            echo "$MSG" >&2
            exit 1
          fi

  # Скип без секрета не должен быть невидимым (находка sanity-ревью C9.1):
  # по расписанию и ручному запуску — напоминание в tracking-issue; на push
  # напоминаний нет, чтобы не спамить при каждом изменении обвязки.
  needs-key:
    name: evals skipped (no ANTHROPIC_API_KEY)
    needs: [gate]
    if: needs.gate.outputs.has_key == 'false' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Remind about the missing secret
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="evals: не настроен ANTHROPIC_API_KEY"
          BODY="Контур evals (ADR 0016) скипается: нет секрета ANTHROPIC_API_KEY. Добавь его в Settings → Secrets → Actions (ключ агентного провайдера по умолчанию — Anthropic; как сменить вендора — docs/evals.md). Прогон: $RUN_URL"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment --repo "${{ github.repository }}" "$EXISTING" --body "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY"
          fi

  report:
    name: report failure
    needs: [evals]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Agent evals failed: $(date -u +%F)" \
            --body "Agent evals failed: $RUN_URL. Артефакт evals-${{ github.run_id }} — отчёт прогона с метриками."
