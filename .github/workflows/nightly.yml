# L5: медленные и исследовательские проверки. Не блокирует merge, при падении заводит issue.
name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  flake-hunt:
    name: e2e flake hunt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: { playwright: 'true' }
      - run: pnpm turbo run build --filter=@repo/web --output-logs=errors-only
      # Случайный порядок и повторы ловят зависимые и нестабильные тесты.
      - run: pnpm --filter @repo/e2e exec playwright test --project=functional --shuffle --repeat-each=5
        env: { CI: 'true' }
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: flake-report, path: e2e/playwright-report/ }

  mutation-full:
    name: mutation (full)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter @repo/api exec stryker run --force
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: mutation-full, path: apps/api/reports/mutation/ }

  perf-trend:
    name: perf trend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: { playwright: 'true' }
      - name: perf
        id: perf
        run: pnpm --filter @repo/e2e exec playwright test --project=perf --repeat-each=3
        env: { CI: 'true' }
      - name: build
        run: pnpm turbo run build --filter=@repo/web --output-logs=errors-only
      - name: bundle
        run: pnpm bundle
      - uses: actions/upload-artifact@v7
        # Диагностический артефакт тренда — всегда, даже с красного прогона.
        if: always()
        with:
          name: perf-trend-${{ github.run_id }}
          path: |
            reports/bundle.json
            e2e/reports/perf.json
          retention-days: 90
      # База — артефакт perf-baseline последнего зелёного nightly (ADR 0006,
      # уровень 2; чекер и коды выходов — шапка tools/check-perf-trend.ts).
      # Коды fetch-baseline: 0 found/stale, 3 none (первый запуск), 1 ошибка API.
      - name: fetch baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          code=0
          node tools/check-perf-trend.main.ts fetch-baseline --out baseline --exclude-run "${{ github.run_id }}" --create-issue --run-url "$RUN_URL" || code=$?
          case "$code" in
            0) echo "mode=found" >> "$GITHUB_OUTPUT";;
            3) echo "mode=none" >> "$GITHUB_OUTPUT";;
            *) exit 1;;
          esac
      - name: compare against baseline
        id: compare
        if: steps.baseline.outputs.mode == 'found'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node tools/check-perf-trend.main.ts compare --candidate e2e/reports/perf.json --baseline baseline --create-issue --head-sha "${{ github.sha }}" --run-url "$RUN_URL"
      # База двигается только от зелёного сравнения или первого запуска; с
      # красного прогона артефакт не пишется — база не дрейфует по красному.
      - name: prepare baseline artifact
        if: >-
          always() && steps.perf.outcome == 'success' && steps.baseline.outcome == 'success' &&
          (steps.compare.outcome == 'success' || steps.compare.outcome == 'skipped')
        run: |
          mkdir -p perf-baseline
          cp e2e/reports/perf.json perf-baseline/perf.json
          node tools/check-perf-trend.main.ts write-meta --out perf-baseline --sha "${{ github.sha }}" --run-id "${{ github.run_id }}"
      - uses: actions/upload-artifact@v7
        if: >-
          always() && steps.perf.outcome == 'success' && steps.baseline.outcome == 'success' &&
          (steps.compare.outcome == 'success' || steps.compare.outcome == 'skipped')
        with:
          name: perf-baseline
          path: perf-baseline/
          retention-days: 90

  # Канарейка 200 мс (A6 PR-3): в обработчик create вставляется задержка, и
  # сравнение ОБЯЗАНО стать красным — иначе job красный («канарейка не ловит»).
  # Read-only к базлайну этого же прогона: свой отчёт под perf-baseline не
  # заливается никогда (находка sanity-ревью A6.1). На первом запуске базлайна
  # ещё нет — инверсия честно пропускается с записью в лог.
  perf-canary:
    name: perf canary (200 ms)
    needs: [perf-trend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: { playwright: 'true' }
      - name: fetch baseline of this run
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if ! gh run download "${{ github.run_id }}" -n perf-baseline -D baseline; then
            echo "perf-baseline ещё не существует (первый запуск) — инверсия пропустится"
          fi
      - name: apply 200 ms canary patch
        run: node tools/perf-canary-patch.ts
      - run: pnpm turbo run build --filter=@repo/web --output-logs=errors-only
      - name: perf with slow create
        run: pnpm --filter @repo/e2e exec playwright test --project=perf --repeat-each=3
        env: { CI: 'true' }
      - name: compare must fail
        if: ${{ hashFiles('baseline/**') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node tools/check-perf-trend.main.ts compare --candidate e2e/reports/perf.json --baseline baseline --expect-regression
      - name: no baseline — inversion skipped
        if: ${{ hashFiles('baseline/**') == '' }}
        run: echo "сравнение с базлайном этого прогона невозможно — см. шаг fetch"

  gate-canaries:
    name: gate canaries
    runs-on: ubuntu-latest
    # 45 мин: slow-канарейки с perf (A6 PR-1) на холодном кэше раннера.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        # Полная история: bundle-delta (канарейка и негатив-проверки) строит базу
        # от merge-base(HEAD, origin/main) (A6 PR-2, ADR 0013).
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
        with: { playwright: 'true' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm canaries

  verify-budgets:
    name: verify budgets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        # Полная история: шаг bundle-delta строит базу от merge-base(HEAD,
        # origin/main) (A6 PR-2, ADR 0013); на main база == HEAD — шаг быстрый.
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
        with: { playwright: 'true' }
      # З6/B1: бюджеты времени enforce только здесь (ubuntu-раннер — та же
      # калибровка, первый прогон с bundle-delta покажет фактическое время;
      # калибровка порога — по тренд-данным, подъём — человеческим PR (З7).
      - run: mkdir -p reports && pnpm verify --full --enforce-budgets --json > reports/verify-durations.json
        env: { CI: 'true' }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verify-durations-${{ github.run_id }}
          path: reports/verify-durations.json
          retention-days: 90

  backlog-doctor:
    name: backlog doctor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Полная история: doctor сверяет ветки task/* с доской (ADR 0007, «Замыкание задачи»).
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
      - run: pnpm backlog doctor
        env:
          GH_TOKEN: ${{ github.token }}

  report:
    name: report failure
    needs:
      [
        flake-hunt,
        mutation-full,
        perf-trend,
        perf-canary,
        gate-canaries,
        verify-budgets,
        backlog-doctor,
      ]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Nightly failed: $(date -u +%F)" \
            --label nightly-failure \
            --body "Nightly checks failed: $RUN_URL"
