# L5: медленные и исследовательские проверки. Не блокирует merge, при падении заводит issue.
name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # issues: write срезан на job-уровень (e16): workflow-уровень доставал его
  # jobs без нужды (mutation-full не создаёт issues вовсе; flake-hunt и report —
  # создают, но job-level permissions заменяет workflow-level целиком, поэтому
  # каждому — свой полный набор).

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  flake-hunt:
    name: e2e flake hunt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Полный набор обязателен: job-level permissions заменяет workflow-уровень
    # целиком (e16). issues: write нужен gh issue list/comment/create (дедуп
    # flaky-issue); contents: read — checkout.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: $/.github/actions/setup
        with: { playwright: 'true' }
      - run: pnpm turbo run build --filter=@repo/web --output-logs=errors-only
      # Случайный порядок и повторы ловят зависимые и нестабильные тесты.
      # Случайный порядок и повторы локально красили прогон (18.3с, 2 failed+1 flaky на
      # e2e-reporting/api-logs): канарейка отчётов API (c4) — спавн дочернего прогона
      # с REUSE_SERVER=1 — не переживает параллельную копию самой себя: два повтора
      # теста делят e2e/reports/instance-token (перезапись между записью и чтением)
      # и test-results-canary (старт дочернего прогона чистит outputDir соседа —
      # «attachment file does not exist»). Локальное воспроизведение e31: --workers=2
      # → 2 failed + 1 flaky, --workers=1 → 60 passed. flake.json не писался — каскад
      # на check-flaky-rate (ENOENT). Серийный прогон убирает только параллельные
      # гонки повторов (их продолжает ловить PR CI); shuffle и repeat-each остаются.
      # --workers=1 фиксирует серийность детерминированно, а не как workers: 1 в
      # конфиге, который поменял бы PR CI.
      - run: pnpm --filter @repo/e2e exec playwright test --project=functional --shuffle --repeat-each=5 --workers=1 --reporter=json
        # Путь от пакета, не от корня: pnpm exec исполняет команду в каталоге
        # пакета (e2e/), 'e2e/reports/flake.json' уезжал бы в e2e/e2e/reports/ —
        # чекер ниже читает e2e/reports/flake.json от корня и всегда падал бы
        # ENOENT, даже на зелёном playwright-шаге (наблюдалось: ENOENT был и при
        # падении канарейки, и был бы при её успехе).
        env: { CI: 'true', PLAYWRIGHT_JSON_OUTPUT_NAME: 'reports/flake.json' }
        continue-on-error: true
      - name: flaky rate + quarantine (b4.4)
        # --rate-out (c9.4): вычисленный гейтом rate — единственный источник
        # тренда телеметрии, чтобы она не пересчитывала flaky rate сама.
        run: node tools/check-flaky-rate.ts --report e2e/reports/flake.json --quarantine tools/flaky-quarantine.json --repeat 5 --flaky-out e2e/reports/flaky-titles.txt --rate-out e2e/reports/flaky-rate.json
      # Артефакт телеметрии (c9.4, B1 ревью): без него тренд flaky rate
      # неосуществим — flake.json раньше не покидал job. always: зелёный
      # прогон тоже обязан оставить точку тренда; отсутствие файла у
      # конкретного прогона телеметрия читает как «нет данных», битый
      # flake.json красит сам шаг выше (exit 1) — З11 через job report.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: flaky-rate
          path: |
            e2e/reports/flake.json
            e2e/reports/flaky-rate.json
          retention-days: 90
          if-no-files-found: ignore
      - name: flaky issues — один на тест (b4.4, дедуп)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          test -f e2e/reports/flaky-titles.txt || exit 0
          while IFS= read -r TITLE; do
            [ -z "$TITLE" ] && continue
            FOUND=$(gh issue list --repo "${{ github.repository }}" --state open --search "[flaky] $TITLE in:title" --limit 1 --json number --jq '.[0].number' 2>/dev/null || true)
            BODY="Воспроизвёл в flake-hunt: $RUN_URL"
            if [ -n "$FOUND" ]; then
              echo "[flaky] $TITLE — существующий issue #$FOUND, комментирую"
              gh issue comment "$FOUND" --repo "${{ github.repository }}" --body "$BODY"
            else
              gh issue create --repo "${{ github.repository }}" --title "[flaky] $TITLE" --body "$BODY"
            fi
          done < e2e/reports/flaky-titles.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with: { name: flake-report, path: e2e/playwright-report/ }

  mutation-full:
    name: mutation (full)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Явный contents: read (e16): job issues не создаёт — читает, а не наследует.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: $/.github/actions/setup
      # b2.4: mutation-full остаётся артефактом ТОЛЬКО api — телеметрия c9.4
      # (telemetry-report.main.ts:397) ищет артефакт по точному имени и берёт
      # contents[0] глоба '*mutation.json' как «домен apps/api»; три отчёта в
      # одном артефакте молча подменяли бы домен тренда (находка план-ревью
      # b2.4). Web и контракты — соседними артефактами: mutation-full-web и
      # mutation-full-contracts, читает их джоба mutation-ratchet.
      - run: pnpm --filter @repo/api exec stryker run --force
      - run: pnpm --filter @repo/web exec stryker run --force
      - run: pnpm --filter @repo/contracts exec stryker run --force
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: mutation-full, path: apps/api/reports/mutation/ }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: mutation-full-web, path: apps/web/reports/mutation/ }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: mutation-full-contracts, path: packages/contracts/reports/mutation/ }

  # Храповик мутационных порогов web и контрактов (b2.4, З7): порог поднимает
  # автоматика по правилу ADR 0009 (факт, округлённый вниз, минус 5 п.п.),
  # только вверх; предлагает PR, когда счёт пакета выше порога в двух
  # последних зелёных прогонах подряд («устойчивое превышение»; зелёность
  # job-scoped — артефакт состояния пишется только от успеха собственных
  # шагов, по образцу perf-baseline). Логика в tools/check-mutation-ratchet
  # (.main).ts; красная джоба заводит issue через report.needs (L5, З11).
  mutation-ratchet:
    name: mutation ratchet (b2.4)
    needs: [mutation-full]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # fetch-state: артефакты прошлых ночных прогонов
      contents: write # ветка и коммит храповика
      pull-requests: write # PR храповика
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: $/.github/actions/setup
      - name: download this run's reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # upload-artifact с одним каталогом в path кладёт его СОДЕРЖИМОЕ в
          # корень артефакта: mutation.json лежит в корне, а не в reports/mutation/
          # (e33: «-D work/web» + чтение work/web/reports/mutation/mutation.json —
          # missing-report с первого прогона, джоба родилась слепой). Каталог —
          # зеркало reportPath из tools/check-mutation-ratchet.ts под work/;
          # соответствие upload↔download↔read сверяет тест tools/test/.
          gh run download "${{ github.run_id }}" -n mutation-full-web -D work/web/reports/mutation
          gh run download "${{ github.run_id }}" -n mutation-full-contracts -D work/contracts/reports/mutation
      # Зубья порога дублем от stryker (он красит mutation-full сам): отчёт из
      # артефакта обязан читаться и не упасть ниже break — иначе храповик
      # молчал бы на битом артефакте (З11).
      - name: check current scores
        run: node tools/check-mutation-ratchet.main.ts check --web work/web/reports/mutation/mutation.json --contracts work/contracts/reports/mutation/mutation.json
      - name: fetch previous state
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Коды как у perf fetch-baseline: 0 найден, 3 первый запуск, 1 ошибка.
          code=0
          node tools/check-mutation-ratchet.main.ts fetch-state --out prev --exclude-run "${{ github.run_id }}" || code=$?
          case "$code" in
            0) echo "mode=found" >> "$GITHUB_OUTPUT";;
            3) echo "mode=none" >> "$GITHUB_OUTPUT";;
            *) exit 1;;
          esac
      - name: decide
        env:
          PREV_MODE: ${{ steps.prev.outputs.mode }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p state
          PREV_FLAG=""
          if [ "$PREV_MODE" = "found" ]; then
            PREV_FLAG="--prev prev"
          fi
          node tools/check-mutation-ratchet.main.ts decide \
            --web work/web/reports/mutation/mutation.json \
            --contracts work/contracts/reports/mutation/mutation.json \
            $PREV_FLAG \
            --state-out state \
            --proposal-out state/proposal.json \
            --head-sha "$HEAD_SHA" \
            --run-id "$RUN_ID"
      - name: upload state artifact
        # Только от успеха check/decide: окно устойчивости считается по зелёным
        # собственным шагам, красный прогон состояние не пишет.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: mutation-ratchet-state, path: state/ratchet-state.json }
      - name: PR with raised thresholds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f state/proposal.json ]; then
            echo "Устойчивого превышения нет — PR храповика не нужен."
            exit 0
          fi
          git config user.name "nightly-ratchet"
          git config user.email "nightly-ratchet@users.noreply.github.com"
          BRANCH="chore/mutation-ratchet-web-contracts"
          git checkout -b "$BRANCH"
          node tools/check-mutation-ratchet.main.ts apply --proposal state/proposal.json
          git commit -am "chore: поднятие мутационного порога break web и контрактов (nightly, b2.4)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ":refs/heads/$BRANCH" 2>/dev/null || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore: поднятие мутационного порога break web и контрактов (nightly)" \
            --body-file <(printf '%s\n%s\n' "Автоматическое поднятие thresholds.break web и контрактов после зелёного nightly (b2.4, З7): правило ADR 0009 «Пороги» от устойчивого счёта, только вверх. Порог может только ужесточаться — каждое повышение проходит приёмку человека: label \`gate-change-approved\` после последнего push (force-repush ветки снимает label на synchronize, ADR 0002)." "$(cat state/proposal.json)") \
            || echo "PR храповика уже открыт — ветка обновлена."

  # Канарейка храповика (критерий приёмки b2.4): искусственно завышенный
  # порог обязан дать нарушение — иначе job красный («канарейка не ловит»).
  # Порог подаётся прямо на вход чекера (--break-override), реальный
  # stryker.conf.json не правится и полный прогон мутаций не повторяется
  # (находка план-ревью b2.4). Вторая половина критерия — предложение PR при
  # устойчивом превышении — покрыта юнит-тестами decide в tools/test/.
  mutation-canary:
    name: mutation canary (inflated break)
    needs: [mutation-ratchet]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: $/.github/actions/setup
      - name: download this run's reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # upload-artifact с одним каталогом в path кладёт его СОДЕРЖИМОЕ в
          # корень артефакта: mutation.json лежит в корне, а не в reports/mutation/
          # (e33: «-D work/web» + чтение work/web/reports/mutation/mutation.json —
          # missing-report с первого прогона, джоба родилась слепой). Каталог —
          # зеркало reportPath из tools/check-mutation-ratchet.ts под work/;
          # соответствие upload↔download↔read сверяет тест tools/test/.
          gh run download "${{ github.run_id }}" -n mutation-full-web -D work/web/reports/mutation
          gh run download "${{ github.run_id }}" -n mutation-full-contracts -D work/contracts/reports/mutation
      - name: check must fail
        run: node tools/check-mutation-ratchet.main.ts check --web work/web/reports/mutation/mutation.json --contracts work/contracts/reports/mutation/mutation.json --break-override web=1000 --break-override contracts=1000 --expect-regression

  # Дрейф живого ruleset от снимка (a11): живое правило меняется в интерфейсе
  # в любой момент — снимок продолжит утверждать защиту, которой нет.
  ruleset-drift:
    name: ruleset drift (a11)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: ruleset drift check
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node tools/check-ruleset-drift.ts --create-issue --run-url "$RUN_URL"

  # Сводный check здоровья workflow (e26): каждый workflow, ожидаемо
  # стартующий на main (триггеры push/schedule из .github/workflows/**),
  # обязан иметь зелёный прогон на свежем head-коммите main либо свежий
  # schedule-прогон в окне. Закрывает escaped-defect 2026-11-21: workflow с
  # битым uses не стартовал ни разу, а вне required checks main оставался
  # зелёным. Красный прогон заводит issue через job report (needs). Незавершённый
  # молодой прогон — не красный (окно CI на свежем коммите), старше 6 ч — красный.
  workflow-health:
    name: workflow health (e26)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # actions: read обязателен: чекер читает Actions API (gh api repos/…/commits,
    # /actions/workflows, /actions/runs) — без него GITHUB_TOKEN получает 403 на
    # /actions/* и гейт был бы красным каждый первый прогон (находка ревью e26).
    # contents: read — commits API и checkout. Job-level permissions заменяет
    # workflow-уровень целиком (e16).
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: workflow health check
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node tools/check-workflow-health.ts

  # Храповик числа тестов (a10): поднимает автоматика, не автор PR
  # (test-count-baseline.json — «горячий» файл, З9). Update refuses to lower.
  test-count-ratchet:
    name: test count ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      # playwright: 'true' обязателен (e31): turbo test включает @repo/ui#test —
      # vitest browser mode, ему нужен Chromium. Без флага шаги Cache/Install
      # Chromium пропускаются и джоба красная с первого прогона (ночь 21.11,
      # run 44894601530: "Executable doesn't exist ... chromium_headless_shell").
      - uses: $/.github/actions/setup
        with: { playwright: 'true' }
      - run: pnpm turbo run test --output-logs=errors-only
      - run: pnpm test:count:update
      - name: PR with raised baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- test-count-baseline.json; then
            echo "Базлайн актуален — PR храповика не нужен."
            exit 0
          fi
          git config user.name "nightly-ratchet"
          git config user.email "nightly-ratchet@users.noreply.github.com"
          BRANCH="chore/test-count-ratchet"
          git checkout -b "$BRANCH"
          git commit -am "chore: поднятие храповика числа тестов (nightly, a10)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ":refs/heads/$BRANCH" 2>/dev/null || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore: поднятие храповика числа тестов (nightly)" \
            --body "Автоматическое поднятие test-count-baseline.json после зелёного nightly (a10): числовой храповик поднимает автоматика, а не автор PR. Update понижать отказывается — дифф только вверх." \
            || echo "PR храповика уже открыт — ветка обновлена."

  perf-trend:
    name: perf trend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: $/.github/actions/setup
        with: { playwright: 'true' }
      # build/bundle ДО perf: perf-конфиг поднимает webServer = production-entry
      # (start:prod = node server.ts, C3.4), которому нужен dist (turbo-задача
      # perf зависит от ^build — как в PR).
      - name: build
        run: pnpm turbo run build --filter=@repo/web --output-logs=errors-only
      - name: bundle
        run: pnpm bundle
      - name: perf
        id: perf
        run: pnpm --filter @repo/e2e exec playwright test --project=perf --repeat-each=3
        env: { CI: 'true' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # Диагностический артефакт тренда — всегда, даже с красного прогона.
        if: always()
        with:
          name: perf-trend-${{ github.run_id }}
          path: |
            reports/bundle.json
            e2e/reports/perf.json
          retention-days: 90
      # База — артефакт perf-baseline последнего зелёного nightly (ADR 0006,
      # уровень 2; чекер и коды выходов — шапка tools/check-perf-trend.ts).
      # Коды fetch-baseline: 0 found/stale, 3 none (первый запуск), 1 ошибка API.
      - name: fetch baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          code=0
          node tools/check-perf-trend.main.ts fetch-baseline --out baseline --exclude-run "${{ github.run_id }}" --create-issue --run-url "$RUN_URL" || code=$?
          case "$code" in
            0) echo "mode=found" >> "$GITHUB_OUTPUT";;
            3) echo "mode=none" >> "$GITHUB_OUTPUT";;
            *) exit 1;;
          esac
      - name: compare against baseline
        id: compare
        if: steps.baseline.outputs.mode == 'found'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node tools/check-perf-trend.main.ts compare --candidate e2e/reports/perf.json --baseline baseline --create-issue --head-sha "${{ github.sha }}" --run-url "$RUN_URL"
      # База двигается только от зелёного сравнения или первого запуска; с
      # красного прогона артефакт не пишется — база не дрейфует по красному.
      - name: prepare baseline artifact
        if: >-
          always() && steps.perf.outcome == 'success' && steps.baseline.outcome == 'success' &&
          (steps.compare.outcome == 'success' || steps.compare.outcome == 'skipped')
        run: |
          mkdir -p perf-baseline
          cp e2e/reports/perf.json perf-baseline/perf.json
          node tools/check-perf-trend.main.ts write-meta --out perf-baseline --sha "${{ github.sha }}" --run-id "${{ github.run_id }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: >-
          always() && steps.perf.outcome == 'success' && steps.baseline.outcome == 'success' &&
          (steps.compare.outcome == 'success' || steps.compare.outcome == 'skipped')
        with:
          name: perf-baseline
          path: perf-baseline/
          retention-days: 90

  # Канарейка 200 мс (A6 PR-3): в обработчик create вставляется задержка, и
  # сравнение ОБЯЗАНО стать красным — иначе job красный («канарейка не ловит»).
  # Read-only к базлайну этого же прогона: свой отчёт под perf-baseline не
  # заливается никогда (находка sanity-ревью A6.1). На первом запуске базлайна
  # ещё нет — инверсия честно пропускается с записью в лог.
  perf-canary:
    name: perf canary (200 ms)
    needs: [perf-trend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: $/.github/actions/setup
        with: { playwright: 'true' }
      - name: fetch baseline of this run
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # Различаем «артефакта нет» (первый запуск или база не обновилась —
          # см. perf-trend) и «ошибка API/скачивания» (красный: канарейка —
          # единственный самоконтроль детектора, молчать он не имеет права).
          if ! ARTIFACT=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq 'first(.artifacts[] | select(.name == "perf-baseline" and .expired != true) | .name)' 2>/dev/null); then
            echo "✗ артефактное API недоступно"; exit 1
          fi
          if [ -z "$ARTIFACT" ]; then
            echo "perf-baseline у этого прогона нет (база не обновилась — см. job perf-trend) — инверсия пропускается"
            exit 0
          fi
          gh run download "${{ github.run_id }}" -n perf-baseline -D baseline
      - name: apply 200 ms canary patch
        run: node tools/perf-canary-patch.ts
      - run: pnpm turbo run build --filter=@repo/web --output-logs=errors-only
      - name: perf with slow create
        run: pnpm --filter @repo/e2e exec playwright test --project=perf --repeat-each=3
        env: { CI: 'true' }
      - name: compare must fail
        if: ${{ hashFiles('baseline/**') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node tools/check-perf-trend.main.ts compare --candidate e2e/reports/perf.json --baseline baseline --expect-regression
      - name: no baseline — inversion skipped
        if: ${{ hashFiles('baseline/**') == '' }}
        run: echo "сравнение с базлайном этого прогона невозможно — см. шаг fetch"

  gate-canaries:
    name: gate canaries
    runs-on: ubuntu-latest
    # 45 мин: slow-канарейки с perf (A6 PR-1) на холодном кэше раннера.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # Полная история: bundle-delta (канарейка и негатив-проверки) строит базу
        # от merge-base(HEAD, origin/main) (A6 PR-2, ADR 0013).
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: $/.github/actions/setup
        with: { playwright: 'true' }
      - run: pnpm install --frozen-lockfile
      # Канарейка копии (d8.3): copier из PyPI (З5-исключение, ADR 0004),
      # версия — один источник tools/copier-version.txt (З10).
      - run: pipx install "copier==$(cat tools/copier-version.txt)"
      - run: pnpm canaries

  verify-budgets:
    name: verify budgets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # Полная история: шаг bundle-delta строит базу от merge-base(HEAD,
        # origin/main) (A6 PR-2, ADR 0013); на main база == HEAD — шаг быстрый.
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: $/.github/actions/setup
        with: { playwright: 'true' }
      # З6/B1: бюджеты времени enforce только здесь (ubuntu-раннер — та же
      # калибровка, первый прогон с bundle-delta покажет фактическое время;
      # калибровка порога — по тренд-данным, подъём — человеческим PR (З7).
      - run: mkdir -p reports && pnpm verify --full --enforce-budgets --json > reports/verify-durations.json
        env: { CI: 'true' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verify-durations-${{ github.run_id }}
          path: reports/verify-durations.json
          retention-days: 90

  backlog-doctor:
    name: backlog doctor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Полная история: doctor сверяет ветки task/* с доской (ADR 0007, «Замыкание задачи»).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: $/.github/actions/setup
      # Гейт целостности доски — deny-модуль напрямую (ADR 0014): ночной контур
      # не зависит от review-класса CLI доски.
      - run: node tools/backlog-doctor.ts
        env:
          GH_TOKEN: ${{ github.token }}

  telemetry:
    name: telemetry trends (c9.4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # З6: бюджет времени и минимальный набор permissions. issues: write не
    # нужен — issue при красном telemetry создаёт job report (telemetry в его
    # needs — решение B3 ревью c9.4); untrusted-входы (артефакты, тела PR)
    # валидируются в чекере, в summary идут только числа/id/статусы.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # Полная история: конфликты пар task/* считаются git merge-tree по
        # удалённым ссылкам — fetch-depth 1 их не привозит.
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: $/.github/actions/setup
      - name: fetch task branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: git fetch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" '+refs/heads/task/*:refs/remotes/origin/task/*'
      - name: telemetry report (trends.json + step summary)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p reports
          node tools/telemetry-report.main.ts --period-days 30 --out reports/trends.json --summary
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # Всегда: даже красный сбор телеметрии оставляет trends.json с
        # problems[] — диагностика по артефакту, issue создаёт report.
        if: always()
        with:
          name: trends-${{ github.run_id }}
          path: reports/trends.json
          retention-days: 90

  report:
    name: report failure
    needs:
      [
        flake-hunt,
        mutation-full,
        mutation-ratchet,
        mutation-canary,
        perf-trend,
        perf-canary,
        gate-canaries,
        verify-budgets,
        backlog-doctor,
        workflow-health,
        telemetry,
      ]
    if: failure()
    runs-on: ubuntu-latest
    # issues: write — gh issue create о падении; contents: read для единого
    # полного набора (e16).
    permissions:
      contents: read
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Nightly failed: $(date -u +%F)" \
            --label nightly-failure \
            --body "Nightly checks failed: $RUN_URL"
