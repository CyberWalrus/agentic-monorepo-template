# L5: медленные и исследовательские проверки. Не блокирует merge, при падении заводит issue.
name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  flake-hunt:
    name: e2e flake hunt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
        with: { playwright: 'true' }
      - run: pnpm turbo run build --filter=@repo/web --output-logs=errors-only
      # Случайный порядок и повторы ловят зависимые и нестабильные тесты.
      # Случайный порядок и повторы ловят зависимые и нестабильные тесты.
      # JSON-репорт пишет файл (PLAYWRIGHT_JSON_OUTPUT_NAME), stdout — человек.
      - run: pnpm --filter @repo/e2e exec playwright test --project=functional --shuffle --repeat-each=5 --reporter=json
        env: { CI: 'true', PLAYWRIGHT_JSON_OUTPUT_NAME: 'e2e/reports/flake.json' }
        continue-on-error: true
      - name: flaky rate + quarantine (b4.4)
        run: node tools/check-flaky-rate.ts --report e2e/reports/flake.json --quarantine tools/flaky-quarantine.json --repeat 5 --flaky-out e2e/reports/flaky-titles.txt
      - name: flaky issues — один на тест (b4.4, дедуп)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          test -f e2e/reports/flaky-titles.txt || exit 0
          while IFS= read -r TITLE; do
            [ -z "$TITLE" ] && continue
            FOUND=$(gh issue list --repo "${{ github.repository }}" --state open --search "[flaky] $TITLE in:title" --limit 1 --json number --jq '.[0].number' 2>/dev/null || true)
            BODY="Воспроизвёл в flake-hunt: $RUN_URL"
            if [ -n "$FOUND" ]; then
              echo "[flaky] $TITLE — существующий issue #$FOUND, комментирую"
              gh issue comment "$FOUND" --repo "${{ github.repository }}" --body "$BODY"
            else
              gh issue create --repo "${{ github.repository }}" --title "[flaky] $TITLE" --body "$BODY"
            fi
          done < e2e/reports/flaky-titles.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with: { name: flake-report, path: e2e/playwright-report/ }

  mutation-full:
    name: mutation (full)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter @repo/api exec stryker run --force
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: mutation-full, path: apps/api/reports/mutation/ }

  # Дрейф живого ruleset от снимка (a11): живое правило меняется в интерфейсе
  # в любой момент — снимок продолжит утверждать защиту, которой нет.
  ruleset-drift:
    name: ruleset drift (a11)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: ruleset drift check
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node tools/check-ruleset-drift.ts --create-issue --run-url "$RUN_URL"

  # Храповик числа тестов (a10): поднимает автоматика, не автор PR
  # (test-count-baseline.json — «горячий» файл, З9). Update refuses to lower.
  test-count-ratchet:
    name: test count ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: pnpm turbo run test --output-logs=errors-only
      - run: pnpm test:count:update
      - name: PR with raised baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- test-count-baseline.json; then
            echo "Базлайн актуален — PR храповика не нужен."
            exit 0
          fi
          git config user.name "nightly-ratchet"
          git config user.email "nightly-ratchet@users.noreply.github.com"
          BRANCH="chore/test-count-ratchet"
          git checkout -b "$BRANCH"
          git commit -am "chore: поднятие храповика числа тестов (nightly, a10)"
          git push origin ":refs/heads/$BRANCH" 2>/dev/null || true
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore: поднятие храповика числа тестов (nightly)" \
            --body "Автоматическое поднятие test-count-baseline.json после зелёного nightly (a10): числовой храповик поднимает автоматика, а не автор PR. Update понижать отказывается — дифф только вверх." \
            || echo "PR храповика уже открыт — ветка обновлена."

  perf-trend:
    name: perf trend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
        with: { playwright: 'true' }
      # build/bundle ДО perf: perf-конфиг поднимает webServer = vite preview,
      # которому нужен dist (turbo-задача perf зависит от ^build — как в PR).
      - name: build
        run: pnpm turbo run build --filter=@repo/web --output-logs=errors-only
      - name: bundle
        run: pnpm bundle
      - name: perf
        id: perf
        run: pnpm --filter @repo/e2e exec playwright test --project=perf --repeat-each=3
        env: { CI: 'true' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # Диагностический артефакт тренда — всегда, даже с красного прогона.
        if: always()
        with:
          name: perf-trend-${{ github.run_id }}
          path: |
            reports/bundle.json
            e2e/reports/perf.json
          retention-days: 90
      # База — артефакт perf-baseline последнего зелёного nightly (ADR 0006,
      # уровень 2; чекер и коды выходов — шапка tools/check-perf-trend.ts).
      # Коды fetch-baseline: 0 found/stale, 3 none (первый запуск), 1 ошибка API.
      - name: fetch baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          code=0
          node tools/check-perf-trend.main.ts fetch-baseline --out baseline --exclude-run "${{ github.run_id }}" --create-issue --run-url "$RUN_URL" || code=$?
          case "$code" in
            0) echo "mode=found" >> "$GITHUB_OUTPUT";;
            3) echo "mode=none" >> "$GITHUB_OUTPUT";;
            *) exit 1;;
          esac
      - name: compare against baseline
        id: compare
        if: steps.baseline.outputs.mode == 'found'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node tools/check-perf-trend.main.ts compare --candidate e2e/reports/perf.json --baseline baseline --create-issue --head-sha "${{ github.sha }}" --run-url "$RUN_URL"
      # База двигается только от зелёного сравнения или первого запуска; с
      # красного прогона артефакт не пишется — база не дрейфует по красному.
      - name: prepare baseline artifact
        if: >-
          always() && steps.perf.outcome == 'success' && steps.baseline.outcome == 'success' &&
          (steps.compare.outcome == 'success' || steps.compare.outcome == 'skipped')
        run: |
          mkdir -p perf-baseline
          cp e2e/reports/perf.json perf-baseline/perf.json
          node tools/check-perf-trend.main.ts write-meta --out perf-baseline --sha "${{ github.sha }}" --run-id "${{ github.run_id }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: >-
          always() && steps.perf.outcome == 'success' && steps.baseline.outcome == 'success' &&
          (steps.compare.outcome == 'success' || steps.compare.outcome == 'skipped')
        with:
          name: perf-baseline
          path: perf-baseline/
          retention-days: 90

  # Канарейка 200 мс (A6 PR-3): в обработчик create вставляется задержка, и
  # сравнение ОБЯЗАНО стать красным — иначе job красный («канарейка не ловит»).
  # Read-only к базлайну этого же прогона: свой отчёт под perf-baseline не
  # заливается никогда (находка sanity-ревью A6.1). На первом запуске базлайна
  # ещё нет — инверсия честно пропускается с записью в лог.
  perf-canary:
    name: perf canary (200 ms)
    needs: [perf-trend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
        with: { playwright: 'true' }
      - name: fetch baseline of this run
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # Различаем «артефакта нет» (первый запуск или база не обновилась —
          # см. perf-trend) и «ошибка API/скачивания» (красный: канарейка —
          # единственный самоконтроль детектора, молчать он не имеет права).
          if ! ARTIFACT=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq 'first(.artifacts[] | select(.name == "perf-baseline" and .expired != true) | .name)' 2>/dev/null); then
            echo "✗ артефактное API недоступно"; exit 1
          fi
          if [ -z "$ARTIFACT" ]; then
            echo "perf-baseline у этого прогона нет (база не обновилась — см. job perf-trend) — инверсия пропускается"
            exit 0
          fi
          gh run download "${{ github.run_id }}" -n perf-baseline -D baseline
      - name: apply 200 ms canary patch
        run: node tools/perf-canary-patch.ts
      - run: pnpm turbo run build --filter=@repo/web --output-logs=errors-only
      - name: perf with slow create
        run: pnpm --filter @repo/e2e exec playwright test --project=perf --repeat-each=3
        env: { CI: 'true' }
      - name: compare must fail
        if: ${{ hashFiles('baseline/**') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node tools/check-perf-trend.main.ts compare --candidate e2e/reports/perf.json --baseline baseline --expect-regression
      - name: no baseline — inversion skipped
        if: ${{ hashFiles('baseline/**') == '' }}
        run: echo "сравнение с базлайном этого прогона невозможно — см. шаг fetch"

  gate-canaries:
    name: gate canaries
    runs-on: ubuntu-latest
    # 45 мин: slow-канарейки с perf (A6 PR-1) на холодном кэше раннера.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # Полная история: bundle-delta (канарейка и негатив-проверки) строит базу
        # от merge-base(HEAD, origin/main) (A6 PR-2, ADR 0013).
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
        with: { playwright: 'true' }
      - run: pnpm install --frozen-lockfile
      # Канарейка копии (d8.3): copier из PyPI (З5-исключение, ADR 0004),
      # версия — один источник tools/copier-version.txt (З10).
      - run: pipx install "copier==$(cat tools/copier-version.txt)"
      - run: pnpm canaries

  verify-budgets:
    name: verify budgets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # Полная история: шаг bundle-delta строит базу от merge-base(HEAD,
        # origin/main) (A6 PR-2, ADR 0013); на main база == HEAD — шаг быстрый.
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
        with: { playwright: 'true' }
      # З6/B1: бюджеты времени enforce только здесь (ubuntu-раннер — та же
      # калибровка, первый прогон с bundle-delta покажет фактическое время;
      # калибровка порога — по тренд-данным, подъём — человеческим PR (З7).
      - run: mkdir -p reports && pnpm verify --full --enforce-budgets --json > reports/verify-durations.json
        env: { CI: 'true' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verify-durations-${{ github.run_id }}
          path: reports/verify-durations.json
          retention-days: 90

  backlog-doctor:
    name: backlog doctor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Полная история: doctor сверяет ветки task/* с доской (ADR 0007, «Замыкание задачи»).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
      # Гейт целостности доски — deny-модуль напрямую (ADR 0014): ночной контур
      # не зависит от review-класса CLI доски.
      - run: node tools/backlog-doctor.ts
        env:
          GH_TOKEN: ${{ github.token }}

  report:
    name: report failure
    needs:
      [
        flake-hunt,
        mutation-full,
        perf-trend,
        perf-canary,
        gate-canaries,
        verify-budgets,
        backlog-doctor,
      ]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Nightly failed: $(date -u +%F)" \
            --label nightly-failure \
            --body "Nightly checks failed: $RUN_URL"
