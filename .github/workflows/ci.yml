# Детерминированные гейты (L3 в PR, L4 в merge queue). Единственный обязательный check — `gate`.
name: CI

on:
  pull_request:
    # edited: смена base-ветки не порождает synchronize, а check привязан к head SHA.
    # Labelы обрабатывает gate-integrity.yml (ADR 0002), здесь они не нужны.
    types: [opened, synchronize, reopened, edited]
  merge_group:
  push:
    branches: [main]
  # b3.1 (ADR 0015): push базлайнов доверенным workflow сделан GITHUB_TOKEN,
  # события он не рождает — CI на новый head SHA запускает visual-approve
  # диспатчем с ref ветки PR. Определение ci.yml при диспатче берётся из ветки,
  # как и при pull_request same-repo (merge-ref) — уровень доверия тот же.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  # В PR проверяем только затронутое; в merge queue и на main — всё (с кэшем это дёшево).
  AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
  TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
  # Порты детерминированы в CI (ADR 0005, З9): без него base выводится из пути
  # чекаута, который у раннеров отличается от прогона к прогону.
  PORT_BASE: 3300
  # Remote cache (A7, architecture.md §3.3): job из PR только читает (remote:r),
  # merge queue кэшу main не доверяет и гоняет задачи принудительно (только
  # локальный кэш), пишет только job на push в main. Сам токен отсюда не выдаётся:
  # TURBO_TOKEN/TURBO_TEAM/TURBO_API приходят из environment job'а — cache-read
  # (read-only токен) или cache-write (токен на запись, environment ограничен
  # protected-веткой main). Пока кэш не подключён, секреты пусты — turbo работает
  # на локальном кэше .turbo.
  TURBO_CACHE_ARGS: ${{ github.event_name == 'push' && '--cache=local:rw,remote:rw' || (github.event_name == 'merge_group' && '--cache=local:rw' || '--cache=local:rw,remote:r') }}

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A7: environment определяет, какой TURBO_TOKEN достаётся job'у: read-only
    # из cache-read, на запись — из cache-write (только push в protected main).
    environment: ${{ github.event_name == 'push' && 'cache-write' || 'cache-read' }}
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ vars.TURBO_API }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: $/.github/actions/setup
      # A7: локальный кэш PR — свой, изолированный от main и других PR по номеру
      # PR; компенсирует отсутствие remote-записи из PR (architecture.md §3.3).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: github.event_name == 'pull_request'
        with:
          path: .turbo
          key: turbo-pr-${{ github.event.pull_request.number }}-static-${{ github.sha }}
          restore-keys: |
            turbo-pr-${{ github.event.pull_request.number }}-
      - name: start clock
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - run: pnpm format:check
      - run: pnpm lint --format github
      # Гейт окружения (C3.1): process.env/import.meta.env только в env-модулях,
      # env.example на месте и в формате KEY=VALUE (полнота — в тестах приложений).
      - run: pnpm env:check
      - run: pnpm turbo run typecheck $AFFECTED $TURBO_CACHE_ARGS --output-logs=errors-only
      - run: pnpm typecheck:tools
      - run: pnpm boundaries
      - run: pnpm knip
      # Состав workspace (e20): обязательные задачи turbo объявлены пакетами —
      # turbo-прогон без носителей завершается exit 0 и тихо выключает job.
      - run: pnpm required-tasks:check
      - run: pnpm sherif
      - run: pnpm visual-image:check
      - run: pnpm test:integrity
      # Тесты обвязки под кэшем turbo (E1): отчёт восстанавливается из кэша,
      # проверка отчёта идёт ниже явным --only (A3).
      - run: pnpm turbo run test:hooks $TURBO_CACHE_ARGS --output-logs=errors-only
      # Корневой vitest: отчёт проверяется здесь явным --only (A3).
      - run: pnpm test:report --only reports/vitest-hooks.json
      # Храповик здесь сравнит только hooks-строку базлайна (остальные отчёты
      # пишет job unit): корневые хуки не остаются без проверки числа тестов.
      # --affected литеральный (e21): static не гоняет пакетные тесты даже на
      # merge_group/push — отчёты пакетов отсутствуют легально, а $AFFECTED на
      # этих событиях пуст и вернул бы 4 ложных WARNING на полном прогоне.
      - run: pnpm test:count --affected
      - run: pnpm sandbox:check
      # Классы защиты tools/ (ADR 0014): замыкание == deny protected-paths.json.
      - run: pnpm tool-class:check
      - run: pnpm docs:check
      - run: pnpm --filter @repo/contracts openapi:check
      # Дрейф routeTree.gen.ts (b7.1): committed-файл == свежая генерация без
      # сборки; конфликт производного файла решает pnpm regen (З10).
      - run: pnpm routetree:check
      # Сканер секретов и аудит зависимостей (b6): audit в CI, где есть сеть;
      # порог high и только production — dev-зависимости шумят (подводный камень задачи).
      - run: pnpm secrets:check
      - run: pnpm audit:check
      - name: duration to summary
        if: always()
        env: { JOB: static }
        run: echo "duration $JOB — $(( $(date +%s) - ${JOB_START:-0} ))s" >> "$GITHUB_STEP_SUMMARY"

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A7: environment cache-read/cache-write — см. комментарий в job static.
    environment: ${{ github.event_name == 'push' && 'cache-write' || 'cache-read' }}
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ vars.TURBO_API }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: $/.github/actions/setup
        with: { playwright: 'true' }
      # A7: локальный кэш PR — см. комментарий в job static.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: github.event_name == 'pull_request'
        with:
          path: .turbo
          key: turbo-pr-${{ github.event.pull_request.number }}-unit-${{ github.sha }}
          restore-keys: |
            turbo-pr-${{ github.event.pull_request.number }}-
      - name: start clock
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - run: pnpm turbo run test $AFFECTED $TURBO_CACHE_ARGS --output-logs=errors-only
      # Гейт по отчёту раннера (З3, A3): ожидания выводятся из dry-графа turbo,
      # поэтому требуются отчёты ровно гонявшихся задач. Тот же $AFFECTED, что
      # у прогона выше: на merge_group и push оба без --affected.
      - run: pnpm test:report --from-turbo test $AFFECTED
      # hooks-отчёт для храповика ниже (e21): на merge_group/push test:count
      # идёт без --affected и требует полный набор отчётов базлайна, а
      # test:hooks — отдельная turbo-задача (turbo.json #test:hooks), которую
      # unit иначе не гоняет. На PR дубль со static безвреден: --affected у
      # храповика легализует отсутствие не затронутых отчётов.
      - run: pnpm turbo run test:hooks $TURBO_CACHE_ARGS --output-logs=errors-only
      # Храповик числа тестов (З7, A3): warning-only, предупреждение идёт в сводку PR.
      # $AFFECTED — тот же контракт, что у test:report выше: на PR отчёты
      # не затронутых пакетов отсутствуют легально; на merge_group/push прогон
      # полный и WARNING «report is missing» честно ловит удалённый пакет.
      # pipefail: краш чекера не должен маскироваться exit-кодом tee.
      - run: set -o pipefail && pnpm test:count $AFFECTED | tee "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: '**/coverage/'
          if-no-files-found: ignore
      - name: duration to summary
        if: always()
        env: { JOB: unit }
        run: echo "duration $JOB — $(( $(date +%s) - ${JOB_START:-0} ))s" >> "$GITHUB_STEP_SUMMARY"

  mutation:
    name: mutation
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A7: job исполняет код PR — токен только read-only (см. комментарий в static).
    # Без environment сюда наследовал бы гипотетический repo-секрет TURBO_TOKEN.
    environment: cache-read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ vars.TURBO_API }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: $/.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          # b2.4: incremental-файлы web и контрактов — как у api (отложенное
          # сюда решение b2.2: кэш в CI для всех трёх мутируемых пакетов).
          path: |
            apps/api/reports/mutation/stryker-incremental.json
            apps/web/reports/mutation/stryker-incremental.json
            packages/contracts/reports/mutation/stryker-incremental.json
          # Restore-key stryker-main- удалён (e16): mutation не бежит на push в main
          # (if: github.event_name != 'push') — ключ stryker-main-* не пишется никем,
          # чтение несуществующего ключа всегда мимо. Межветочный кэш — отдельная
          # задача при появлении потребности.
          key: stryker-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            stryker-${{ github.head_ref || github.ref_name }}-
      - name: start clock
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - run: pnpm turbo run mutation $AFFECTED $TURBO_CACHE_ARGS --output-logs=errors-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-report
          # b2.4: отчёты всех трёх мутируемых пакетов (у web и контрактов свои
          # thresholds.break — красный прогон диагностируется по артефакту).
          path: |
            apps/api/reports/mutation/
            apps/web/reports/mutation/
            packages/contracts/reports/mutation/
          if-no-files-found: ignore
      - name: duration to summary
        if: always()
        env: { JOB: mutation }
        run: echo "duration $JOB — $(( $(date +%s) - ${JOB_START:-0} ))s" >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A7: environment cache-read/cache-write — см. комментарий в job static.
    environment: ${{ github.event_name == 'push' && 'cache-write' || 'cache-read' }}
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ vars.TURBO_API }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: $/.github/actions/setup
        with: { playwright: 'true' }
      # A7: локальный кэш PR — см. комментарий в job static.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: github.event_name == 'pull_request'
        with:
          path: .turbo
          key: turbo-pr-${{ github.event.pull_request.number }}-e2e-${{ github.sha }}
          restore-keys: |
            turbo-pr-${{ github.event.pull_request.number }}-
      - name: start clock
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      # Выбор E2E по фичам (B4.1): только в PR — merge queue, push и nightly
      # идут целиком. Base тот же, что у TURBO_SCM_BASE (пакетный --affected
      # turbo). Ошибка диффа валит шаг громко: молча «всё» здесь не безопаснее.
      - name: e2e feature selection
        if: github.event_name == 'pull_request'
        run: |
          # --no-renames: переименование между фичами отдаёт оба пути — старая
          # фича тоже попадает в прогон (инвариант «ошибаться в сторону больше»).
          CHANGED=$(git diff --no-renames --name-only "${{ github.event.pull_request.base.sha }}"...HEAD)
          SELECTION=$(printf '%s\n' "$CHANGED" | node tools/e2e-select.ts --from-stdin)
          echo "E2E_FEATURES=$SELECTION" >> "$GITHUB_ENV"
      - run: pnpm turbo run e2e $AFFECTED $TURBO_CACHE_ARGS --output-logs=errors-only
      # Проект functional с default:false не запускается без явного --project —
      # гейт требует его присутствия в отчёте (A3). $AFFECTED — как у прогона.
      - run: pnpm test:report --from-turbo e2e $AFFECTED --expect-project functional
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
      - name: duration to summary
        if: always()
        env: { JOB: e2e }
        run: echo "duration $JOB — $(( $(date +%s) - ${JOB_START:-0} ))s" >> "$GITHUB_STEP_SUMMARY"

  visual:
    name: visual
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A7: environment cache-read/cache-write — см. комментарий в job static.
    environment: ${{ github.event_name == 'push' && 'cache-write' || 'cache-read' }}
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ vars.TURBO_API }}
    # Тот же образ и архитектура, что у `pnpm visual` локально: базлайны совпадают.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: start clock
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: $/.github/actions/setup
      # A7: локальный кэш PR — см. комментарий в job static.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: github.event_name == 'pull_request'
        with:
          path: .turbo
          key: turbo-pr-${{ github.event.pull_request.number }}-visual-${{ github.sha }}
          restore-keys: |
            turbo-pr-${{ github.event.pull_request.number }}-
      # Две фазы (b3.1, ADR 0015): обычный прогон (дифф = красный job и отчёт),
      # затем перезапись только разошедшихся базлайнов и сборка артефакта
      # visual-actuals для одобрения командой /approve-visual.
      - run: bash tools/visual-ci.sh
        env:
          CI: 'true'
          # head SHA PR (не merge-ref): манифест артефакта сверяется с ним в
          # visual-approve (b3.1, ADR 0015); на workflow_dispatch пусто —
          # повторный прогон идёт уже по исправленному дереву.
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: visual-actuals
          path: visual-actuals/
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: visual-report
          path: |
            visual-diff/
            e2e/playwright-report/
            e2e/test-results/
            packages/ui/.vitest/
      - name: duration to summary
        if: always()
        env: { JOB: visual }
        run: echo "duration $JOB — $(( $(date +%s) - ${JOB_START:-0} ))s" >> "$GITHUB_STEP_SUMMARY"

  perf:
    name: perf
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A7: только чтение remote — и то лишь для build-зависимости, сама задача
    # perf вне кэша (cache: false в turbo.json): писать job'у нечего.
    environment: ${{ github.event_name == 'push' && 'cache-write' || 'cache-read' }}
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ vars.TURBO_API }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: $/.github/actions/setup
        with: { playwright: 'true' }
      - name: start clock
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - run: pnpm turbo run build --filter=@repo/web $TURBO_CACHE_ARGS --output-logs=errors-only
      - run: pnpm bundle
      - run: pnpm turbo run perf $TURBO_CACHE_ARGS --output-logs=errors-only
      - uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece # v1
      - name: API smoke (k6)
        # Порты из tools/ports.ts (ADR 0005, З9): PORT_BASE=3300 задан на уровне workflow.
        run: |
          eval "$(node tools/ports.ts --env)"
          pnpm --filter @repo/api start &
          for _ in $(seq 1 30); do curl -sf "$API_URL/health" > /dev/null && break; sleep 1; done
          k6 run --summary-export=reports/k6.json e2e/perf/k6/api-smoke.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-report
          path: |
            reports/bundle.json
            reports/k6.json
            e2e/reports/perf.json
            e2e/playwright-report/
          if-no-files-found: ignore
      - name: duration to summary
        if: always()
        env: { JOB: perf }
        run: echo "duration $JOB — $(( $(date +%s) - ${JOB_START:-0} ))s" >> "$GITHUB_STEP_SUMMARY"

  # Дельта-гейт бандла (A6 PR-2, ADR 0013). Вне needs у gate намеренно: job
  # исполняет код PR (сборка), а его определение для pull_request берётся из
  # merge-ref — PR может его переписать. Блокирует merge доверенный required
  # check bundle-approval из gate-integrity.yml (определение из base, код PR
  # не исполняется); сверх этого подделка замера требует правки .github/** или
  # tools/** — оба пути защищены (gate-change-approved).
  bundle-delta:
    name: bundle-delta
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # 25 мин: капы чекера install 10 + build 15 на холодном раннере — job обязан
    # пережить худший случай сам, иначе SIGTERM вместо чистого fail-closed.
    timeout-minutes: 25
    # A7: job исполняет код PR — токен только read-only (см. комментарий в static).
    environment: cache-read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ vars.TURBO_API }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: $/.github/actions/setup
      - name: start clock
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - run: pnpm turbo run build --filter=@repo/web $TURBO_CACHE_ARGS --output-logs=errors-only
      - run: pnpm bundle:delta --base "${{ github.event.pull_request.base.sha }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bundle-delta-report
          path: reports/bundle-delta.json
          if-no-files-found: ignore
      - name: duration to summary
        if: always()
        env: { JOB: bundle-delta }
        run: echo "duration $JOB — $(( $(date +%s) - ${JOB_START:-0} ))s" >> "$GITHUB_STEP_SUMMARY"

  # Единственный required check в ruleset: имя стабильно, пропущенные affected-джобы не блокируют.
  gate:
    name: gate
    if: always()
    needs: [static, unit, mutation, e2e, visual, perf]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All gates passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' > /dev/null
