# Детерминированные гейты (L3 в PR, L4 в merge queue). Единственный обязательный check — `gate`.
name: CI

on:
  pull_request:
    # edited: смена base-ветки не порождает synchronize, а check привязан к head SHA.
    # Labelы обрабатывает gate-integrity.yml (ADR 0002), здесь они не нужны.
    types: [opened, synchronize, reopened, edited]
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  # В PR проверяем только затронутое; в merge queue и на main — всё (с кэшем это дёшево).
  AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
  TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
  # Порты детерминированы в CI (ADR 0005, З9): без него base выводится из пути
  # чекаута, который у раннеров отличается от прогона к прогону.
  PORT_BASE: 3300
  # Remote cache (опционально): self-hosted или Vercel.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_API: ${{ vars.TURBO_API }}

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
      - name: start clock
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - run: pnpm format:check
      - run: pnpm lint --format github
      - run: pnpm turbo run typecheck $AFFECTED --output-logs=errors-only
      - run: pnpm typecheck:tools
      - run: pnpm boundaries
      - run: pnpm knip
      - run: pnpm sherif
      - run: pnpm visual-image:check
      - run: pnpm test:integrity
      - run: pnpm test:hooks
      # Корневой vitest вне turbo: его отчёт проверяется здесь явным --only (A3).
      - run: pnpm test:report --only reports/vitest-hooks.json
      # Храповик здесь сравнит только hooks-строку базлайна (остальные отчёты
      # пишет job unit): корневые хуки не остаются без проверки числа тестов.
      - run: pnpm test:count
      - run: pnpm sandbox:check
      - run: pnpm docs:check
      - run: pnpm --filter @repo/contracts openapi:check
      - name: duration to summary
        if: always()
        env: { JOB: static }
        run: echo "duration $JOB — $(( $(date +%s) - ${JOB_START:-0} ))s" >> "$GITHUB_STEP_SUMMARY"

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
        with: { playwright: 'true' }
      - name: start clock
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - run: pnpm turbo run test $AFFECTED --output-logs=errors-only
      # Гейт по отчёту раннера (З3, A3): ожидания выводятся из dry-графа turbo,
      # поэтому требуются отчёты ровно гонявшихся задач. Тот же $AFFECTED, что
      # у прогона выше: на merge_group и push оба без --affected.
      - run: pnpm test:report --from-turbo test $AFFECTED
      # Храповик числа тестов (З7, A3): warning-only, предупреждение идёт в сводку PR.
      # pipefail: краш чекера не должен маскироваться exit-кодом tee.
      - run: set -o pipefail && pnpm test:count | tee "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: '**/coverage/'
          if-no-files-found: ignore
      - name: duration to summary
        if: always()
        env: { JOB: unit }
        run: echo "duration $JOB — $(( $(date +%s) - ${JOB_START:-0} ))s" >> "$GITHUB_STEP_SUMMARY"

  mutation:
    name: mutation
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
      - uses: actions/cache@v6
        with:
          path: apps/api/reports/mutation/stryker-incremental.json
          key: stryker-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            stryker-${{ github.head_ref || github.ref_name }}-
            stryker-main-
      - name: start clock
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - run: pnpm turbo run mutation $AFFECTED --output-logs=errors-only
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: apps/api/reports/mutation/
          if-no-files-found: ignore
      - name: duration to summary
        if: always()
        env: { JOB: mutation }
        run: echo "duration $JOB — $(( $(date +%s) - ${JOB_START:-0} ))s" >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
        with: { playwright: 'true' }
      - name: start clock
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - run: pnpm turbo run e2e $AFFECTED --output-logs=errors-only
      # Проект functional с default:false не запускается без явного --project —
      # гейт требует его присутствия в отчёте (A3). $AFFECTED — как у прогона.
      - run: pnpm test:report --from-turbo e2e $AFFECTED --expect-project functional
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
      - name: duration to summary
        if: always()
        env: { JOB: e2e }
        run: echo "duration $JOB — $(( $(date +%s) - ${JOB_START:-0} ))s" >> "$GITHUB_STEP_SUMMARY"

  visual:
    name: visual
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Тот же образ и архитектура, что у `pnpm visual` локально: базлайны совпадают.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - name: start clock
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup
      - run: bash tools/visual-inner.sh
        env: { CI: 'true' }
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            packages/ui/.vitest/
      - name: duration to summary
        if: always()
        env: { JOB: visual }
        run: echo "duration $JOB — $(( $(date +%s) - ${JOB_START:-0} ))s" >> "$GITHUB_STEP_SUMMARY"

  perf:
    name: perf
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
        with: { playwright: 'true' }
      - name: start clock
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - run: pnpm turbo run build --filter=@repo/web --output-logs=errors-only
      - run: pnpm bundle
      - run: pnpm turbo run perf --output-logs=errors-only
      - uses: grafana/setup-k6-action@v1
      - name: API smoke (k6)
        # Порты из tools/ports.ts (ADR 0005, З9): PORT_BASE=3300 задан на уровне workflow.
        run: |
          eval "$(node tools/ports.ts --env)"
          pnpm --filter @repo/api start &
          for _ in $(seq 1 30); do curl -sf "$API_URL/health" > /dev/null && break; sleep 1; done
          k6 run e2e/perf/k6/api-smoke.js
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-report
          path: |
            reports/bundle.json
            e2e/reports/perf.json
            e2e/playwright-report/
          if-no-files-found: ignore
      - name: duration to summary
        if: always()
        env: { JOB: perf }
        run: echo "duration $JOB — $(( $(date +%s) - ${JOB_START:-0} ))s" >> "$GITHUB_STEP_SUMMARY"

  # Единственный required check в ruleset: имя стабильно, пропущенные affected-джобы не блокируют.
  gate:
    name: gate
    if: always()
    needs: [static, unit, mutation, e2e, visual, perf]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All gates passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' > /dev/null
