# Контур цепочки поставок (b6): CodeQL, линтер workflow (zizmor) и
# dependency-review на PR (отчёт о новой зависимости в сводке PR).
# Информационные check-и: в gate не входят, merge блокируют детерминированные
# проверки ci.yml; красный джоб — сигнал владельцу CODEOWNERS.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Раз в неделю во вторник 05:17 UTC — CodeQL и zizmor на свежем main.
    - cron: '17 5 * * 2'

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: $/.github/actions/setup
      # TypeScript/JavaScript: единственный язык продукта (ADR 0001).
      - uses: github/codeql-action/init@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3.39.4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3.39.4

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # Отчёт о новой зависимости в сводке PR: лицензии, уязвимости, стоимость
      # риска; OpenSSF Scorecard подключается следующим шагом после b6 (журнал).
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          comment-summary-in-pr: always
          # Отчёт информационный: порог блокировки ставит человек по факту шума
          # (ADR 0009 «Пороги»), сейчас fail-on-* не включены.

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      # Линтер workflow-файлов: аудит прав на токен, инъекций в run:, pinning.
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          # Версия сканера зафиксирована (e76): с `latest` релиз выбирает обёртка,
          # и новый аудит включается без изменения репозитория (24.11.2026 — поезд
          # стоял около двух часов). Обновление — отдельный PR: версию поднимает
          # правило Renovate в .github/renovate.json либо человек, на самом PR
          # джоба zizmor идёт уже с новой версией. Точность держит шаг action-pins.
          version: v1.32.0
