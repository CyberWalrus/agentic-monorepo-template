# Доверенный workflow одобрения визуальных базлайнов (b3.1, ADR 0015).
# Определение берётся из основной ветки (issue_comment всегда исполняет
# дефолтную ветку), код PR не исполняется ни на одном шаге: checkout head —
# только git-операции над деревом (копирование файлов артефакта и коммит),
# никаких скриптов из дерева PR (З2, по образцу gate-integrity ADR 0002).
#
# ЗАПРЕЩЕНО менять без режима обслуживания и ревью мейнтейнера. Запрещено:
# - исполнять что-либо из PR (npm/pnpm/node-скрипты дерева PR);
# - коммитить пути вне канонических базлайнов: e2e/**/__screenshots__/*.webp,
#   packages/ui/**/__screenshots__/*.png из артефакта;
# - коммитить в ветку, отличную от head-ветки PR, или не на одобренный SHA.
#
# Расширение набора доверенных workflow — свой ADR (0015) и правка политики
# docs/github-setup.md, п. 3, в интерфейсе GitHub — человеком.
name: visual-approve

on:
  issue_comment:
    types: [created]

concurrency:
  group: visual-approve-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  pull-requests: write

env:
  REPO: ${{ github.repository }}

jobs:
  approve:
    if: >-
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/approve-visual')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Только дефолтная ветка (github.sha события): CODEOWNERS и tools валидатора.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Fetch comment and PR facts from GitHub API
        id: facts
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          # Комментарий перечитывается из API: payload события редактируем, а
          # решение должно опираться на серверное состояние (З2).
          gh api "repos/${REPO}/issues/comments/${COMMENT_ID}" > comment.json
          gh pr view "${PR_NUMBER}" --repo "${REPO}" --json headRefOid,headRefName,isCrossRepository > pr.json
          # Fork-PR: head-ветка живёт в чужом репозитории — push в «ветку с тем
          # же именем» базового репо и диспатч её ci.yml недопустимы (security-
          # ревью b3.1, major 2).
          if jq -e '.isCrossRepository == true' pr.json >/dev/null; then
            echo "approved=false" >> "$GITHUB_OUTPUT"
            echo "reply=PR из форка: head-ветка вне этого репозитория — базлайны коммитятся только в ветки этого репозитория" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Время последнего push — тот же прокси, что в gate-integrity: min
          # started_at check-run'ов на head-коммите (ставит GitHub). Пагинация:
          # check-run'ов может быть больше 100 (minor 8 security-ревью).
          HEAD_SHA=$(jq -r .headRefOid pr.json)
          gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?per_page=100" > pushed-check-runs.json

      - name: Validate approve-visual command
        id: approval
        if: success() && steps.facts.outputs.approved != 'false'
        run: |
          node tools/check-visual-approval.ts comment.json pr.json pushed-check-runs.json .github/CODEOWNERS CODEOWNERS docs/CODEOWNERS

      - name: Post rejection reason to the PR
        if: steps.approval.outputs.approved != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPLY: ${{ steps.approval.outputs.reply || steps.facts.outputs.reply }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
        run: |
          # Ответ виден в ленте PR рядом с диффом (З11); на посторонний текст
          # (не команду) workflow не отвечает.
          gh pr comment "$PR_NUMBER" --repo "$REPO" \
            --body '❌ Базлайны не закоммичены: '"$REPLY"' Посмотрите свежий дифф в job "visual" и повторите /approve-visual с текущим head SHA ([команда]('"$COMMENT_URL"')).'

      # Дальше — только для валидного одобрения. checkout head SHA: git-операции
      # над деревом PR (копирование файлов артефакта и коммит), исполнения кода
      # PR нет (З2).
      - name: Checkout PR head without executing it
        if: success() && steps.approval.outputs.approved == 'true'
        run: |
          HEAD_SHA=$(jq -r .headRefOid pr.json)
          # persist-credentials: false на первом checkout — токен явный.
          git fetch --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$HEAD_SHA"
          git checkout "$HEAD_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Symlink-каталоги в дереве PR: коммит-симлинк мог бы увести запись
          # копирования вовне worktree (minor 3 security-ревью b3.1).
          find e2e packages/ui -type l -delete 2>/dev/null || true

      - name: Download and verify visual-actuals artifact
        if: success() && steps.approval.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_SHA=$(jq -r .headRefOid pr.json)
          # Прогон для PR event'а исполняется на merge-ref с другим SHA: прогон
          # артефакта ищем по check-run'у "visual" на head SHA (авторитетная
          # связь коммит->job, major 1 architecture/security-ревью b3.1).
          VISUAL_JOB=$(gh api --paginate "repos/${REPO}/commits/${HEAD_SHA}/check-runs?per_page=100" | jq -r '.check_runs[] | select(.name == "visual") | .details_url' | tail -1)
          if [ -z "$VISUAL_JOB" ]; then
            echo "check-run visual на ${HEAD_SHA} не найден — диффа не было, одобрять нечего (fail-closed)" >&2
            exit 1
          fi
          JOB_ID=${VISUAL_JOB##*/}
          RUN_ID=$(gh api "repos/${REPO}/actions/jobs/${JOB_ID}" --jq .run_id)
          ARTIFACT_ID=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/artifacts" | jq -r '.artifacts[] | select(.name == "visual-actuals" and .expired == false) | .id' | tail -1)
          if [ -z "$ARTIFACT_ID" ]; then
            echo "Артефакт visual-actuals в прогоне ${RUN_ID} не найден — visual job не собирал базлайны (fail-closed)" >&2
            exit 1
          fi
          mkdir -p actuals
          gh api "repos/${REPO}/actions/artifacts/${ARTIFACT_ID}/zip" > actuals.zip
          unzip -q actuals.zip -d actuals
          rm -f actuals.zip
          # Symlinks из артефакта удаляются: копирование могло бы за ними
          # прочитать произвольный файл раннера. Артефакт производит код PR.
          find actuals -type l -delete
          jq -e --arg sha "${HEAD_SHA}" '.headSha == $sha and ((.files | length) + (.deleted | length)) > 0' actuals/manifest.json >/dev/null
          jq -r '.files[]' actuals/manifest.json > actuals/files.txt
          jq -r '.deleted[]' actuals/manifest.json > actuals/deleted.txt
          check_path() {
            case "$1" in
              e2e/*__screenshots__/*.png|e2e/*__screenshots__/*.webp|packages/ui/*__screenshots__/*.png|packages/ui/*__screenshots__/*.webp) ;;
              *) echo "Путь вне канонических базлайнов: ${1}" >&2; exit 1 ;;
            esac
            case "$1" in
              *..*|/*) echo "Небезопасный путь: ${1}" >&2; exit 1 ;;
            esac
          }
          while IFS= read -r file; do
            check_path "$file"
            [ -f "actuals/${file}" ] || { echo "Файл из манифеста не найден в артефакте: ${file}" >&2; exit 1; }
          done < actuals/files.txt
          while IFS= read -r file; do
            check_path "$file"
          done < actuals/deleted.txt
          echo "Артефакт проверен: $(wc -l < actuals/files.txt) новых/изменённых, $(wc -l < actuals/deleted.txt) удалённых; headSha совпадает."

      - name: Commit baselines to the PR branch
        if: success() && steps.approval.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_SHA=$(jq -r .headRefOid pr.json)
          BRANCH=$(jq -r .headRefName pr.json)
          LOGIN=$(jq -r .user.login comment.json)
          case "$BRANCH" in
            *[!A-Za-z0-9._/-]*|*..*) echo "Небезопасное имя ветки: ${BRANCH}" >&2; exit 1 ;;
          esac
          while IFS= read -r file; do
            mkdir -p "$(dirname "$file")"
            cp "actuals/${file}" "$file"
            git add "$file"
          done < actuals/files.txt
          # Удалённые базлайны (переименование = D+?? пара в коллекторе).
          while IFS= read -r file; do
            git rm -q --ignore-unmatch "$file"
          done < actuals/deleted.txt
          git commit -m "visual baselines from CI (approved by @${LOGIN} on ${HEAD_SHA})"
          # Push ровно в head-ветку PR. GITHUB_TOKEN push события не рождает —
          # CI на новый head SHA диспатчит следующий шаг. Полные гейты (в т.ч.
          # gate-integrity на новый SHA) человек запускает одним synchronize
          # (пустой push / Update branch): бот-коммит трогает __screenshots__
          # (deny) — свежий gate-change-approved потребуется заново
          # (ADR 0015, известное ограничение).
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${BRANCH}"

      - name: Trigger CI for the new head SHA
        if: success() && steps.approval.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH=$(jq -r .headRefName pr.json)
          gh api -X POST "repos/${REPO}/actions/workflows/ci.yml/dispatches" -f ref="${BRANCH}"

      - name: Post success summary to the PR
        if: success() && steps.approval.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          LOGIN: ${{ github.event.comment.user.login }}
        run: |
          FILES=$(sed 's/^/- /' actuals/files.txt)
          gh pr comment "$PR_NUMBER" --repo "$REPO" \
            --body '✅ Базлайны из CI закоммичены в ветку PR (одобрил @'"${LOGIN}"'):
          '"${FILES}"'
          CI перезапущен диспатчем (fast-часть гейтов). Полные гейты — после synchronize: пустой push (git commit --allow-empty) или кнопка Update branch; бот-коммит трогает __screenshots__ (deny) — после прогона поставьте gate-change-approved как обычно. Отчёт диффа — в артефактах job "visual".'
