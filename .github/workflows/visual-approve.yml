# Доверенный workflow одобрения визуальных базлайнов (b3.1, ADR 0015).
# Определение берётся из основной ветки (issue_comment всегда исполняет
# дефолтную ветку), код PR не исполняется ни на одном шаге: checkout head —
# только git-операции над деревом (копирование файлов артефакта и коммит),
# никаких скриптов из дерева PR (З2, по образцу gate-integrity ADR 0002).
#
# ЗАПРЕЩЕНО менять без режима обслуживания и ревью мейнтейнера. Запрещено:
# - исполнять что-либо из PR (npm/pnpm/node-скрипты дерева PR);
# - коммитить пути вне канонических базлайнов: e2e/**/__screenshots__/*.png и
#   packages/ui/**/__screenshots__/*.png из артефакта;
# - коммитить в ветку, отличную от head-ветки PR, или не на одобренный SHA.
#
# Расширение набора доверенных workflow — свой ADR (0015) и правка политики
# docs/github-setup.md, п. 3, в интерфейсе GitHub — человеком.
name: visual-approve

on:
  issue_comment:
    types: [created, edited]

concurrency:
  group: visual-approve-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  pull-requests: write

env:
  REPO: ${{ github.repository }}

jobs:
  approve:
    if: >-
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/approve-visual')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Только дефолтная ветка (github.sha события): CODEOWNERS и tools валидатора.
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Fetch comment and PR facts from GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          # Комментарий перечитывается из API: payload события редактируем, а
          # решение должно опираться на серверное состояние (З2).
          gh api "repos/${REPO}/issues/comments/${COMMENT_ID}" > comment.json
          gh pr view "${PR_NUMBER}" --repo "${REPO}" --json headRefOid,headRefName > pr.json
          # Время последнего push — тот же прокси, что в gate-integrity: min
          # started_at check-run'ов на head-коммите (ставит GitHub).
          HEAD_SHA=$(jq -r .headRefOid pr.json)
          gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?per_page=100" > pushed-check-runs.json

      - name: Validate approve-visual command
        id: approval
        run: |
          node tools/check-visual-approval.ts comment.json pr.json pushed-check-runs.json .github/CODEOWNERS CODEOWNERS docs/CODEOWNERS

      - name: Post rejection reason to the PR
        if: steps.approval.outputs.approved != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPLY: ${{ steps.approval.outputs.reply }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
        run: |
          # Ответ виден в ленте PR рядом с диффом (З11); на посторонний текст
          # (не команду) workflow не отвечает.
          gh pr comment "$PR_NUMBER" --repo "$REPO" \
            --body '❌ Базлайны не закоммичены: '"$REPLY"' Посмотрите свежий дифф в job "visual" и повторите /approve-visual с текущим head SHA ([команда]('"$COMMENT_URL"')).'

      # Дальше — только для валидного одобрения. checkout head SHA: git-операции
      # над деревом PR (копирование файлов артефакта и коммит), исполнения кода
      # PR нет (З2).
      - name: Checkout PR head without executing it
        if: steps.approval.outputs.approved == 'true'
        run: |
          HEAD_SHA=$(jq -r .headRefOid pr.json)
          git fetch --depth=1 origin "$HEAD_SHA"
          git checkout "$HEAD_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Download and verify visual-actuals artifact
        if: steps.approval.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_SHA=$(jq -r .headRefOid pr.json)
          RUNS=$(gh api "repos/${REPO}/actions/runs?head_sha=${HEAD_SHA}&status=completed&per_page=100")
          RUN_ID=$(printf '%s' "$RUNS" | jq '[.workflow_runs[] | select(.name == "CI")] | sort_by(.id) | last | .id // empty')
          if [ -z "$RUN_ID" ]; then
            echo "CI-прогон для ${HEAD_SHA} не найден — артефакту неоткуда взяться (fail-closed)" >&2
            exit 1
          fi
          ARTIFACT_ID=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/artifacts" | jq -r '.artifacts[] | select(.name == "visual-actuals" and .expired == false) | .id' | tail -1)
          if [ -z "$ARTIFACT_ID" ]; then
            echo "Артефакт visual-actuals в прогоне ${RUN_ID} не найден — visual job не собирал базлайны (fail-closed)" >&2
            exit 1
          fi
          mkdir -p actuals
          gh api "repos/${REPO}/actions/artifacts/${ARTIFACT_ID}/zip" > actuals.zip
          unzip -q actuals.zip -d actuals
          rm -f actuals.zip
          # Symlinks из артефакта удаляются: копирование могло бы за ними
          # прочитать произвольный файл раннера. Артефакт производит код PR.
          find actuals -type l -delete
          jq -e --arg sha "${HEAD_SHA}" '.headSha == $sha and (.files | length) > 0' actuals/manifest.json >/dev/null
          jq -r '.files[]' actuals/manifest.json > actuals/files.txt
          while IFS= read -r file; do
            case "$file" in
              e2e/*__screenshots__/*.png|packages/ui/*__screenshots__/*.png) ;;
              *) echo "Путь вне канонических базлайнов: ${file}" >&2; exit 1 ;;
            esac
            case "$file" in
              *..*|/*) echo "Небезопасный путь: ${file}" >&2; exit 1 ;;
            esac
            [ -f "actuals/${file}" ] || { echo "Файл из манифеста не найден в артефакте: ${file}" >&2; exit 1; }
          done < actuals/files.txt
          echo "Артефакт проверен: $(wc -l < actuals/files.txt) файлов, headSha совпадает."

      - name: Commit baselines to the PR branch
        if: steps.approval.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_LOGIN: ${{ github.event.comment.user.login }}
        run: |
          HEAD_SHA=$(jq -r .headRefOid pr.json)
          BRANCH=$(jq -r .headRefName pr.json)
          while IFS= read -r file; do
            mkdir -p "$(dirname "$file")"
            cp "actuals/${file}" "$file"
            git add "$file"
          done < actuals/files.txt
          git commit -m "visual baselines from CI (approved by ${COMMENT_LOGIN} on ${HEAD_SHA})"
          # Push ровно в head-ветку PR. GITHUB_TOKEN push события не рождает —
          # CI на новый head SHA диспатчит следующий шаг (З4: без него merge
          # ждал бы check'и, которых не будет).
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${BRANCH}"

      - name: Trigger CI for the new head SHA
        if: steps.approval.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH=$(jq -r .headRefName pr.json)
          gh api -X POST "repos/${REPO}/actions/workflows/ci.yml/dispatches" -f ref="${BRANCH}"

      - name: Post success summary to the PR
        if: steps.approval.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_LOGIN: ${{ github.event.comment.user.login }}
        run: |
          FILES=$(sed 's/^/- /' actuals/files.txt)
          gh pr comment "$PR_NUMBER" --repo "$REPO" \
            --body '✅ Базлайны из CI закоммичены в ветку PR (одобрил @'"${COMMENT_LOGIN}"'):
          '"${FILES}"'
          CI перезапущен для нового head SHA; отчёт диффа — в артефактах job "visual".'
